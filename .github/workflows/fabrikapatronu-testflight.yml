# Builds Fabrika Patronu (FabrikaPatronu/src bundled to one file and wrapped with Capacitor) for iOS in the cloud and uploads it
# to TestFlight. No Mac needed. Setup steps: FabrikaPatronu/APPSTORE.md
name: Fabrika Patronu → TestFlight

on:
  # Derlemeyi başlatmanın iki yolu: Actions sekmesinden "Run workflow" (iş akışı varsayılan dalda olmalı)
  # ya da "fabrikapatronu-v1.0.0" biçiminde bir etiket göndermek (etiket hangi daldaysa oradan derlenir).
  push:
    tags: ["fabrikapatronu-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "App Store version (raise it for each new App Store release, e.g. 1.0.1)"
        type: string
        default: "1.0.0"

jobs:
  ios:
    name: Build, sign & upload
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: FabrikaPatronu/app
    env:
      BUNDLE_ID: ${{ vars.FP_BUNDLE_ID }}
      TEAM_ID: ${{ vars.DB_APPLE_TEAM_ID || vars.FK_APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        env:
          HAS_KEY: ${{ secrets.ASC_API_KEY_P8 != '' }}
        run: |
          missing=""
          [ -n "$BUNDLE_ID" ] || missing="$missing FP_BUNDLE_ID(variable)"
          [ -n "$TEAM_ID" ] || missing="$missing DB_APPLE_TEAM_ID(variable)"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID(variable)"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID(variable)"
          [ "$HAS_KEY" = "true" ] || missing="$missing ASC_API_KEY_P8(secret)"
          if [ -n "$missing" ]; then echo "::error::Missing GitHub settings:$missing — see FabrikaPatronu/APPSTORE.md"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            FabrikaPatronu/app/package-lock.json
            FabrikaPatronu/package-lock.json

      - name: Install
        run: npm ci && (cd .. && npm ci)

      - name: Build web game and sync into the iOS project
        run: npm run sync

      # App Store uploads must be built with the newest Xcode (iOS 26 SDK since April 2026). Pick the highest installed.
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      # Bundle ID and version numbers go into the app target only (command-line overrides would also hit the plugin packages).
      - name: Set bundle ID and version
        run: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" "$PBX"
          VERSION="${{ inputs.version }}"; [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME#fabrikapatronu-v}"; [ -n "$VERSION" ] || VERSION=1.0.0
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VERSION;/" "$PBX"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/" "$PBX"
          grep -E "PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION" "$PBX"

      - name: App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY" > ~/private_keys/AuthKey.p8

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FabrikaPatronu.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive | tail -n 80

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FabrikaPatronu.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
          echo "Uploaded build ${{ github.run_number }}. It appears in App Store Connect → TestFlight after processing (5–30 min)."

      - name: Remove API key
        if: always()
        run: rm -f ~/private_keys/AuthKey.p8
