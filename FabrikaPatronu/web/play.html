<title>Fabrika Patronu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>/* FABRİKA PATRONU — yatay mobil arayüz. Koyu lacivert, endüstriyel gri, çelik mavisi, kâr için yeşil, zarar için kırmızı, premium altın. */
:root { color-scheme: dark; --bg: #0c1620; --panel: #132231; --panel2: #1a2d3f; --line: #253c50; --fg: #eef3f7; --muted: #8ea4b6; --steel: #9fbfd8; --gold: #f7c548; --gold2: #e2a92e; --ink: #2b1d00;

/* üst bar */

.tco { flex: 1; min-width: 0; display: flex; flex-direction: column; } .tco b { font-size: 15px; font-weight: 900; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#overlay { position: absolute; inset: 0; pointer-events: none; } #overlay > * { pointer-events: auto; }

.seg { display: inline-flex; gap: 3px; }
.split { display: grid; grid-template-columns: minmax(260px, 0.9fr) minmax(0, 1.5fr); gap: 12px; height: 100%; min-height: 0; } .pane { overflow: auto; min-height: 0; scrollbar-width: thin; }
