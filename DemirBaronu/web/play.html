<title>Demir Baronu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#101418">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen phone trading desk. Ledger HUD on top, scrolling tab content, big "end day" bar + tab bar at the bottom.
   Single deliberate dark look: mill-scale blue-grey steel with a hot-rolled orange for money actions. */
:root {
  color-scheme: dark;
  --bg: #101418; --panel: #182027; --panel2: #212b34; --line: #2e3a45;
  --fg: #e9eef2; --muted: #8e9ba7; --hot: #ff7b2c; --hot-ink: #1e0d00;
  --steel: #8fb6d8; --good: #4cd893; --bad: #ff5d52; --warn: #ffc94a;
  --display: "Chakra Petch", "Arial Black", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --num: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; overflow: hidden; margin: 0;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.gut { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
button:disabled { opacity: .42; cursor: default; }
select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; font-size: 15px; width: 100%; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.muted { color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }

/* HUD */
#hud { padding-block: 10px 8px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #151b21, var(--bg)); position: relative; overflow: hidden; }
#hud > :not(#hudfx) { position: relative; z-index: 1; }
#hudfx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: .38; }
.hrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#coName { font-family: var(--display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--steel);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#dayChip { font-family: var(--num); font-size: 15px; color: var(--muted); white-space: nowrap; }
#dayChip b { color: var(--fg); font-weight: 600; }
#cash { font-family: var(--num); font-weight: 700; font-size: 36px; line-height: 1.05; }
#cash.neg { color: var(--bad); }
.stats { display: flex; gap: 4px 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.stats b { font-family: var(--num); font-size: 15px; font-weight: 600; color: var(--fg); }
.title { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 12px; text-transform: uppercase;
  letter-spacing: .06em; padding: 3px 8px; border-radius: 4px; background: var(--panel2); color: var(--hot); white-space: nowrap; }
#ticker { margin-top: 8px; font-size: 12px; display: flex; gap: 8px; align-items: center; min-height: 20px; }
#ticker .tag { font-family: var(--num); font-weight: 700; background: var(--hot); color: var(--hot-ink); padding: 1px 6px; border-radius: 3px; flex: none; }
#news { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* Content */
#main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
h2 { font-family: var(--display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; margin: 0; color: var(--steel); text-wrap: balance; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.45; background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 12px; }
.hint b { color: var(--fg); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 3px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
.chip.hot { background: rgba(255,123,44,.16); color: var(--hot); }
.chip.st { background: rgba(143,182,216,.14); color: var(--steel); }
.chip.g { background: rgba(76,216,147,.14); color: var(--good); }
.chip.b { background: rgba(255,93,82,.15); color: var(--bad); }
.chip.w { background: rgba(255,201,74,.14); color: var(--warn); }
.filter { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.filter button { padding: 6px 12px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 600; white-space: nowrap; }
.filter button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* Product rows */
.prow { display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.prow.open { border-color: var(--steel); }
.prow.locked { opacity: .5; }
.phead { display: grid; grid-template-columns: 34px minmax(0,1fr) 64px auto; gap: 4px 10px; align-items: center; text-align: left; width: 100%; }
.pname { font-weight: 600; font-size: 14px; }
.pspec { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pprice { text-align: right; }
.pprice .num { font-size: 18px; font-weight: 600; display: block; line-height: 1.1; }
.pprice small { font-family: var(--num); font-size: 13px; }
.pstock { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.pstock b { color: var(--fg); font-family: var(--num); font-size: 14px; font-weight: 600; }
svg.spark { width: 64px; height: 24px; display: block; }
.trade { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; display: flex; flex-direction: column; gap: 8px; }
.qty { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.qty button { min-width: 42px; padding: 7px 8px; border-radius: 6px; background: var(--panel2); font-family: var(--num); font-size: 15px; font-weight: 600; }
.qty button[aria-pressed="true"] { background: var(--steel); color: var(--bg); }
.qty .q { font-family: var(--num); font-size: 22px; font-weight: 700; margin-left: auto; }
.line2 { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.line2 > :first-child { min-width: 0; }
.line2 b { font-family: var(--num); font-size: 15px; color: var(--fg); font-weight: 600; white-space: nowrap; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1 1 0; min-width: 0; padding: 10px 10px; border-radius: 7px; font-weight: 600; font-size: 14px; background: var(--panel2); line-height: 1.2; }
.btn small { display: block; font-family: var(--num); font-size: 13px; font-weight: 600; opacity: .85; }
.btn.hot { background: var(--hot); color: var(--hot-ink); }
.btn.st { background: var(--steel); color: var(--bg); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); flex: 0 0 auto; }
.btn.sm { padding: 6px 10px; font-size: 13px; flex: 0 0 auto; }

/* Order cards */
.ohead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ocust { font-weight: 600; min-width: 0; }
.ocust small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.oamt { text-align: right; flex: none; }
.oamt span.num { display: block; font-size: 20px; font-weight: 700; line-height: 1.1; }
.oamt small { font-size: 13px; color: var(--muted); }
.oprod { font-size: 13px; }
.oprod b { font-family: var(--num); font-size: 16px; }

/* Facilities */
.bar { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--steel); border-radius: 4px; }
.bar i.full { background: var(--warn); }
.kv { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { font-family: var(--num); font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
.ladder { display: flex; flex-direction: column; gap: 4px; }
.ladder div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
.ladder div.me { color: var(--hot); font-weight: 600; }
.ladder div.done { color: var(--fg); }
.item { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.item > div:first-child { min-width: 0; }
.item .btn { flex: 0 0 auto; }
.srow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.srow .muted { font-size: 12px; }
.srow .acts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.ach { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 8px; align-items: center; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.ach .ok { color: var(--good); font-weight: 700; } .ach .no { color: var(--line); font-weight: 700; }
svg.nw { width: 100%; height: 90px; display: block; }

/* Bottom */
#bottom { border-top: 1px solid var(--line); background: var(--panel); padding-block: 8px max(8px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
#endDay { width: 100%; padding: 13px; border-radius: 8px; background: var(--hot); color: var(--hot-ink); font-family: var(--display);
  font-size: 17px; letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: center; align-items: center; gap: 10px; }
#endDay small { font-family: var(--num); font-size: 14px; font-weight: 600; letter-spacing: 0; text-transform: none; opacity: .8; }
#tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
#tabs button { padding: 7px 0; border-radius: 6px; font-size: 11px; font-weight: 600; color: var(--muted); position: relative; }
#tabs button[aria-selected="true"] { color: var(--fg); background: var(--panel2); }
#tabs svg { width: 20px; height: 20px; display: block; margin: 0 auto 2px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.badge { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--hot); color: var(--hot-ink);
  font-family: var(--num); font-size: 12px; font-weight: 700; line-height: 17px; padding: 0 4px; }

/* Toast + modal */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100% - 28px));
  display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 20; }
#toast div { background: var(--fg); color: var(--bg); padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; box-shadow: 0 6px 24px rgba(0,0,0,.4);
  animation: tin .22s ease-out; }
#toast div.bad { background: var(--bad); color: #fff; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
#modal { position: fixed; inset: 0; background: rgba(5,8,10,.72); display: flex; align-items: flex-end; justify-content: center; z-index: 30;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px;
  max-height: 88%; overflow-y: auto; }
#modal h3 { font-family: var(--display); font-size: 22px; margin: 0; color: var(--hot); text-wrap: balance; }
#modal p { margin: 0; line-height: 1.5; color: var(--fg); }
#modal ul { margin: 0; padding-left: 18px; line-height: 1.5; color: var(--muted); }
#modal input { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 16px; }
/* HUD menu button */
.hleft { display: flex; align-items: center; gap: 8px; min-width: 0; }
#menuBtn { width: 32px; height: 28px; border-radius: 6px; background: var(--panel2); display: inline-grid; place-items: center; flex: none; }
#menuBtn svg, .menuBtn2 svg { width: 18px; height: 18px; stroke: var(--fg); fill: none; stroke-width: 2; }
.menuBtn2 { width: 32px; height: 28px; border-radius: 6px; background: var(--hot); display: inline-grid; place-items: center; flex: none; }
.menuBtn2 svg { stroke: var(--hot-ink); }
/* Store */
.skus { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sku { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
.sku.wide { grid-column: 1 / -1; }
.sku.hl { border-color: var(--hot); background: linear-gradient(160deg, rgba(255,123,44,.14), var(--panel) 60%); }
.sku b { font-size: 15px; }
.sku .amt { font-family: var(--num); font-size: 24px; font-weight: 700; color: var(--good); line-height: 1.1; }
.sku .d { font-size: 12.5px; color: var(--muted); line-height: 1.4; flex: 1; }
.sku .tag { position: absolute; top: -8px; right: 10px; background: var(--hot); color: var(--hot-ink); font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
.sku .btn { flex: 0 0 auto; }
.sw { display: flex; gap: 4px; } .sw i { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); }
.legal { font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.legal a { color: var(--steel); }
/* Themes (bought in the store) */
:root[data-skin="skingold"] { --hot: #e8b84a; --hot-ink: #231a00; --steel: #d9c79a; }
:root[data-skin="skinsteel"] { --bg: #15181b; --panel: #1f2327; --panel2: #2a2f34; --line: #394047; --hot: #c9d3dc; --hot-ink: #121518; --steel: #9fb0bf; }
:root[data-skin="skinnight"] { --bg: #0b1020; --panel: #121a33; --panel2: #1a2444; --line: #26335a; --hot: #5aa9ff; --hot-ink: #04122a; --steel: #9db7ff; }
/* Main menu */
#menu { position: fixed; inset: 0; z-index: 25; background: radial-gradient(120% 70% at 50% 0%, #22303b 0%, var(--bg) 62%); overflow-y: auto; }
#menu .inner { width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box; min-height: 100%;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.logo { font-family: var(--display); font-size: 46px; line-height: .92; letter-spacing: .02em; margin: 14px 0 0; text-transform: uppercase; }
.logo span { color: var(--hot); display: block; }
.tagline { color: var(--muted); font-size: 14px; margin: 0 0 4px; line-height: 1.45; }
.tape { overflow: hidden; border-block: 1px solid var(--line); padding: 7px 0; white-space: nowrap; font-family: var(--num); font-size: 15px; color: var(--muted); }
.tape div { display: inline-block; animation: tape 90s linear infinite; }
.tape b { color: var(--fg); font-weight: 600; margin-left: 4px; }
.tape i { font-style: normal; margin: 0 16px 0 4px; }
@keyframes tape { to { transform: translateX(-50%); } }
.mbtn { width: 100%; text-align: left; padding: 13px 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; font-size: 16px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.mbtn small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
.mbtn.hot { background: var(--hot); color: var(--hot-ink); border-color: var(--hot); }
.mbtn.hot small { color: var(--hot-ink); opacity: .8; }
.mbtn .arrow { font-family: var(--display); font-size: 18px; }
.mhead { display: flex; align-items: center; gap: 10px; }
.mhead h2 { font-size: 18px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { padding: 10px 6px; border-radius: 8px; background: var(--panel2); font-weight: 600; font-size: 14px; line-height: 1.25; }
.seg button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--steel); color: var(--bg); }
.seg button[aria-pressed="true"] small { color: var(--bg); }
.help h3 { font-family: var(--display); font-size: 15px; color: var(--hot); margin: 6px 0 0; letter-spacing: .03em; }
.help p { margin: 0; line-height: 1.5; color: var(--fg); font-size: 14px; }
/* Competition */
.lb { display: grid; grid-template-columns: 24px 28px minmax(0,1fr) auto; gap: 2px 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.lb .dot { width: 10px; height: 10px; border-radius: 3px; }
.lb .rk { font-family: var(--num); font-size: 16px; font-weight: 700; color: var(--muted); }
.lb.me { color: var(--hot); font-weight: 600; }
.lb.me .rk { color: var(--hot); }
.lb.dead { opacity: .45; }
.lb small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
.lb .v { font-family: var(--num); font-size: 15px; text-align: right; }
.share { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--panel2); gap: 1px; }
.share i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.banner { border: 1px solid var(--hot); background: rgba(255,123,44,.08); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.banner .t { font-family: var(--display); color: var(--hot); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.banner p { margin: 0; font-size: 13px; line-height: 1.45; }
.bids { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.bids .btn { padding: 8px 4px; font-size: 14px; }
.bres { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: var(--muted); }
.bres.win { color: var(--good); font-weight: 600; }
.bres.me { color: var(--hot); }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toggle > div { min-width: 0; }
.toggle button { min-width: 70px; padding: 7px 10px; border-radius: 20px; background: var(--panel2); font-weight: 600; font-size: 13px; flex: none; }
.toggle button[aria-pressed="true"] { background: var(--good); color: var(--bg); }
.pic { width: 34px; height: 34px; border-radius: 7px; background: var(--panel2); display: grid; place-items: center; flex: none; }
.pic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg.map { width: 100%; height: auto; display: block; }
svg.map text { font-family: var(--body); }
.steps { display: flex; gap: 3px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--panel2); }
.steps i.on { background: var(--good); }
.task { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3px 0; }
.task.done { color: var(--good); }
.task b { font-family: var(--num); font-weight: 600; white-space: nowrap; }
/* Visuals */
canvas.scene { width: 100%; height: 118px; display: block; border-radius: 6px; background: var(--panel2); }
canvas.pscene { width: 100%; height: 64px; display: block; border-radius: 6px; }
canvas.mscene { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 210px; pointer-events: none; opacity: .85; }
#menu .inner.scenic { padding-bottom: max(200px, env(safe-area-inset-bottom, 0px)); }
#menu .inner { position: relative; z-index: 1; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 28; overflow: hidden; }
.fxtruck { position: absolute; left: 0; bottom: calc(132px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 40px; animation: drive 1.5s cubic-bezier(.45,.05,.55,.95) forwards; }
@keyframes drive { from { transform: translateX(-130px); } to { transform: translateX(calc(100vw + 10px)); } }
.fxmoney { position: absolute; font-family: var(--num); font-weight: 700; font-size: 22px; color: var(--good); text-shadow: 0 2px 8px rgba(0,0,0,.6); animation: rise 1.4s ease-out forwards; white-space: nowrap; }
.fxmoney.bad { color: var(--bad); }
@keyframes rise { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }

function stepMarket(silent) {

  for (const c in S.cityOff) for (const k in S.cityOff[c]) S.cityOff[c][k] = Math.round(Math.max(-0.07, Math.min(0.07, S.cityOff[c][k] * 0.97 + gauss() * 0.004)) * 1e4) / 1e4;

    if (r.cities.length < target && Math.random() < 0.06) {

      const c = wpick(cand, cand.map(c => c.size * (S.locs.some(l => l.city === c.id) ? 1 + st.contest : 1)));
      r.cities.push(c.id);
      const mine = S.locs.some(l => l.city === c.id);

    if (n) { const r = mkRival([n[0], n[1], n[2], n[3], null, rnd(3e5, 2e6), rnd(40e6, 150e6), pick(["#e8a87c", "#9ad0ec", "#b5e48c", "#f6bd60"])]); S.rivals.push(r);
      S.news.unshift({ day: S.day, text: `Sektöre yeni rakip: ${r.name} (${C[r.home].name}).`, rival: true }); }
    S.newcomerDay = null;
  }
  const alive = S.rivals.filter(r => r.alive);
  if (S.priceWar && --S.priceWar.days <= 0) { S.news.unshift({ day: S.day, text: `${CATS[S.priceWar.cat].name} fiyat savaşı sona erdi.` }); S.priceWar = null; }

// Sealed-bid tenders: lowest margin wins; you put down a 3% bid bond.
function genTender() {
  const cats = new Set(unlocked().map(p => p.cat));
  const pr = PROJECTS.filter(([, c]) => cats.has(c)); if (!pr.length) return;
  const [proj, cat] = pick(pr);
  const prods = unlocked().filter(p => p.cat === cat && p.base < 100000), prod = wpick(prods, prods.map(p => p.pop));
  const L = LEVELS[level()];
  S.tenders.push({ id: S.nextId++, proj, prod: prod.id, qty: Math.round(L.qty[1] * rnd(2, 4)), city: wpick(CITIES, CITIES.map(c => c.size)).id,
    base: price(prod.id), due: S.day + 3, bid: null, deposit: 0, deliver: 10 });
  S.news.unshift({ day: S.day, text: `Yeni ihale: ${proj}. Rekabet sekmesinden teklif ver.`, big: true });
}
const tenderValue = (t, m) => t.qty * r10(t.base * (1 + m));
// Rival bids are decided once, so a bought "İhale Kulisi" shows the real ones.
function rollBids(t) {
  const alive = S.rivals.filter(r => r.alive).sort(() => Math.random() - 0.5).slice(0, rint(2, 4));
  t.rbids = alive.map(r => { const st = STYLES[r.style]; const m = rnd(st.bid[0], st.bid[1]) - (diff().aggr - 1) * 0.02 - (r.cat === P[t.prod].cat ? 0.01 : 0); return { id: r.id, m: Math.max(0.005, m) }; });
}
function resolveTenders() {
  S.tenders = S.tenders.filter(t => {
    if (t.due > S.day) return true;
    if (!t.rbids) rollBids(t);
    const bids = t.rbids.map(b => ({ r: rivalById(b.id), m: b.m })).filter(b => b.r && b.r.alive);
    if (t.bid !== null) bids.push({ me: true, m: t.bid });
    bids.sort((a, b) => a.m - b.m || (a.me ? -1 : 1));
    const w = bids[0];
    S.tenderLog.unshift({ proj: t.proj, qty: t.qty, prod: t.prod, day: S.day, bids: bids.map(b => ({ name: b.me ? S.name : b.r.name, m: b.m, me: !!b.me })) });
    S.tenderLog = S.tenderLog.slice(0, 4);
    if (t.bid !== null) S.stats.tenders++;
    if (bids[0] && !bids[0].me && Math.random() < 0.4) S.news.unshift({ day: S.day, text: quote(bids[0].r), rival: true });
    if (w && w.me) {
      S.stats.tendersWon++;
      S.active.push({ id: t.id, cust: t.proj, city: t.city, prod: t.prod, qty: t.qty, pay: 30, risk: "A", proc: null, loyal: false, rival: null, neg: true,
        price: r10(t.base * (1 + t.bid)), deadline: S.day + t.deliver, expires: S.day + 99, tender: true, deposit: t.deposit });
      S.news.unshift({ day: S.day, text: `İhaleyi kazandın: ${t.proj}, ${ton(t.qty)} ${P[t.prod].name}. ${t.deliver} gün içinde teslim et.`, big: true });
      toast(`İhale kazanıldı: ${t.proj}. Aktif siparişlerine eklendi.`); beep("win"); fxBurst("confetti");
    } else if (w) {
      if (t.bid !== null) { S.cash += t.deposit; toast(`${t.proj} ihalesini ${w.r.name} %${nf1.format(w.m * 100)} ile kazandı. Teminatın iade edildi.`, true); }
      w.r.tons += t.qty; w.r.nw += tenderValue(t, w.m) * 0.04;
      S.news.unshift({ day: S.day, text: `${t.proj} ihalesini ${w.r.name} kazandı (%${nf1.format(w.m * 100)}).`, rival: true });

}

      S.news.unshift({ day: S.day + 1, text: `${r.cust} borcun ${tl(part)} kısmını ödedi, kalan ${tl(r.amount)} için ${dateStr(r.due)} sözü verdi.` }); return true; }

    S.news.unshift({ day: S.day + 1, text: `${r.cust} ödemedi. Kredi sigortası devrede: 30 gün içinde ${tl(r.claim)} ödenecek.`, bad: true }); return true; }

  if (c.kind === "suit") { const s = S.suits.find(x => x.id === c.id);
    if (s) { if (i === 0) { S.cash -= s.claim / 2; S.mProfit -= s.claim / 2; s.stage = "done"; S.news.unshift({ day: S.day, text: `${s.cust} ile uzlaşıldı: ${tl(s.claim / 2)} ödendi.` }); }
      else { payLegal(v.fee); s.stage = "court"; s.end = S.day + rint(30, 60); S.news.unshift({ day: S.day, text: `${s.cust} davası mahkemede, karar ${dateStr(s.end)} civarı.` }); } }
    S.suits = S.suits.filter(x => x.stage !== "done"); }
  if (c.kind === "accident") { if (i === 0) { S.cash -= c.comp; S.mProfit -= c.comp; S.news.unshift({ day: S.day, text: `İş kazası tazminatı ödendi: ${tl(c.comp)}.` }); }
    else S.suits.push({ id: S.nextId++, kind: "accident", cust: "İş kazası (işçi ailesi)", claim: c.comp, stage: "court", end: S.day + rint(40, 80) }); }
  if (c.kind === "poach") { if (i === 0) S.cash -= 60000; else if (S.staff.sales) { S.staff.sales--; S.news.unshift({ day: S.day, text: `Bir satış elemanın ${c.rival}'e geçti.`, bad: true }); } }
  checkAch(); save();
}

// =====================================================================
// DAY END
// =====================================================================
function walkIns() {
  let rev = 0, n = 0;
  if (evOn("bayram")) return { rev, n };
  for (const l of S.locs.filter(l => l.type === "shop")) {
    const t = tierOf(l), c = C[l.city];
    const rivalsHere = S.rivals.filter(r => r.alive && r.cities.includes(l.city)).length;
    let k = Math.round(t.walk * c.size * (1 + 0.5 * l.clerks) * (S.rep / 60) * rnd(0.6, 1.4) / (1 + 0.2 * rivalsHere));
    while (k-- > 0) {
      const ids = Object.keys(l.stock); if (!ids.length || handleLeft(l) <= 0) break;
      const id = wpick(ids, ids.map(i => P[i].pop));
      const q = Math.min(l.stock[id].q, handleLeft(l), r2(rnd(0.02, 0.2) * (P[id].base > 100000 ? 0.3 : 1)));
      if (q <= 0) continue;
      const p = priceAt(id, l.city) * rnd(1.08, 1.16), unit = takeStock(l, id, q);
      l.used += q; S.cash += q * p; rev += q * p; n++;
      const profit = q * (p - unit);
      S.stats.profit += profit; S.mProfit += profit; S.stats.retail++; S.stats.retailRev += q * p; S.tons += q;
      S.catTons[P[id].cat] = (S.catTons[P[id].cat] || 0) + q;
    }
  }
  return { rev, n };
}
function incidents() {
  for (const l of S.locs) {
    const ids = Object.keys(l.stock); if (!ids.length) continue;
    let loss = 0, what = "";
    if (Math.random() < 0.006 * (S.staff.guard ? 0.33 : 1)) {
      const id = pick(ids), q = r2(l.stock[id].q * rnd(0.1, 0.3)); loss = q * l.stock[id].cost; takeStock(l, id, q);
      what = `${locName(l)} tesisine hırsız girdi: ${ton(q)} ${P[id].name} çalındı`;
    } else if (Math.random() < 0.0015) {
      for (const id of ids) { const q = r2(l.stock[id].q * 0.4); if (q > 0) { loss += q * l.stock[id].cost; takeStock(l, id, q); } }
      what = `${locName(l)} tesisinde yangın: stoğun %40'ı zarar gördü`;
    }
    if (!loss) continue;
    S.stats.incidents++;
    if (S.insured) { S.cash += loss * 0.9; S.news.unshift({ day: S.day, text: `${what}. Sigorta ${tl(loss * 0.9)} ödedi.`, bad: true }); S.mProfit -= loss * 0.1; }
    else { S.news.unshift({ day: S.day, text: `${what}. Sigorta yok: ${tl(loss)} kayıp.`, bad: true }); S.mProfit -= loss; S.stats.profit -= loss; }
  }
}
function endDay() {
  if (S.over) return;
  const wi = walkIns();
  S.myHist.push(r2(S.tons - S.tonsDayStart)); if (S.myHist.length > 30) S.myHist.shift(); S.tonsDayStart = S.tons;
  let collected = 0, lost = 0, expired = 0, failed = 0, arrived = 0;
  checkTasks();
  const tally = { col: 0, lost: 0, late: 0 };
  S.recv = S.recv.filter(r => processRecv(r, tally));
  collected = tally.col; lost = tally.lost;
  S.day++;
  S.usedCap = 0; S.brokerToday = 0; S.slitUsed = 0; S.locs.forEach(l => l.used = 0);
  S.incoming = S.incoming.filter(i => {
    if (i.arrive > S.day) return true;
    if (i.mode === "mill" && !i.delayed && Math.random() < 0.15) { i.delayed = 1; i.arrive += rint(2, 5);
      S.news.unshift({ day: S.day, text: `Fabrika ${P[i.pid].name} sevkiyatını erteledi: yeni tarih ${dateStr(i.arrive)}.`, bad: true }); return true; }
    const l = locById(i.loc); if (!l) return false;
    let unit = i.unit, extra = "";
    if (i.mode === "imp") { const rest = i.usd * (i.hedge ? i.fx0 : S.fx) - i.adv; S.cash -= rest; unit = (i.adv + rest) / i.q;
      const diffPct = i.hedge ? 0 : S.fx / i.fx0 - 1; extra = i.hedge ? " Kur sabitlenmişti." : ` Kur farkı ${pct(diffPct)}, kalan ödeme ${tl(rest)}.`; }
    addStock(l, i.pid, i.q, unit); arrived++;
    S.news.unshift({ day: S.day, text: `${ton(i.q)} ${P[i.pid].name} ${C[l.city].name} tesisine teslim edildi.${extra}`, bad: extra.includes("+") });
    return false;
  });
  incidents();
  accidents();
  stepSuits();
  const taken = [];
  S.offers = S.offers.filter(o => {
    if (o.expires > S.day) return true;
    const r = o.rival && rivalById(o.rival);
    if (r && r.alive) { r.tons += o.qty; r.nw += orderValue(o) * 0.04; taken.push(`${r.name}: ${ton(o.qty)} ${P[o.prod].name}`); S.stats.rivalsTaken++;
      if ((S.rel[o.cust] || 0) >= 3) { S.rel[o.cust]--; S.news.unshift({ day: S.day, text: `Sadık müşterin ${o.cust} bu sefer ${r.name}'den aldı.`, rival: true, bad: true }); } }
    else expired++;
    return false;
  });
  if (taken.length && Math.random() < 0.3) { const r = pick(S.rivals.filter(x => x.alive)); if (r) S.news.unshift({ day: S.day, text: quote(r), rival: true }); }
  if (taken.length) S.news.unshift({ day: S.day, text: `Rakipler ${taken.length} siparişi kaptı (${taken.slice(0, 2).join(", ")}${taken.length > 2 ? "…" : ""}).`, rival: true });
  S.active = S.active.filter(o => {
    if (o.deadline >= S.day) return true;
    failed++; S.stats.late++; S.rep = Math.max(0, S.rep - (o.tender ? 10 : 6));
    if (!o.tender && (S.rel[o.cust] || 0) >= 3) { const rv = pick(S.rivals.filter(x => x.alive)); S.rel[o.cust] = 0;
      if (rv) S.news.unshift({ day: S.day, text: `${o.cust} gecikmeye kızdı, artık ${rv.name} ile çalışıyor.`, bad: true, rival: true }); }
    S.news.unshift({ day: S.day, text: o.tender ? `${o.cust} ihalesini teslim edemedin. Teminat ${tl(o.deposit)} yandı, itibar −10.` : `${o.cust} siparişini zamanında teslim edemedin. İtibar −6.`, bad: true });
    return false;
  });
  stepMarket(false);
  stepRivals();
  resolveTenders();
  if (level() >= 1 && S.day >= S.nextTenderDay) { genTender(); S.nextTenderDay = S.day + rint(6, 12); }
  stepEvent();
  const made = genOffers();
  let monthMsg = null;
  if ((S.day - 1) % 30 === 0) {
    let items = monthlyCosts();
    if (S.amnesty) items = items.filter(([k]) => k !== "Kredi faizi");
    if (S.cash < 0) items.push(["Eksi bakiye faizi", -S.cash * OVERDRAFT_RATE]);
    const costs = items.reduce((a, [, v]) => a + v, 0);
    const taxable = S.mProfit - costs, tax = S.amnesty ? 0 : Math.max(0, taxable) * taxRate() * (clubOn() ? 0.75 : 1);
    if (S.amnesty) { items.push(["Faiz ve vergi affı uygulandı", 0]); S.amnesty = false; }
    if (tax > 0) items.push([`Geçici vergi (%${Math.round(taxRate() * 100)})`, tax]);
    S.stats.taxes += tax;
    const total = costs + tax;
    S.cash -= total;
    monthMsg = { items, total, net: taxable - tax, rescue: [] };
    S.mProfit = 0;
    // Before declaring bankruptcy the bank discounts receivables, then opens credit up to the limit.
    if (S.cash < 0) {
      let fac = 0;
      for (const r of S.recv.filter(x => x.status === "normal").sort((a, b) => a.due - b.due)) { if (S.cash >= 0) break; const got = r.amount * (1 - factorRate(r)); S.cash += got; fac += got; S.recv = S.recv.filter(x => x !== r); }
      if (fac) monthMsg.rescue.push(["Alacaklar otomatik kırdırıldı", fac]);
      const room = Math.max(0, loanLimit() - S.loan), need = Math.min(room, Math.ceil(-S.cash / 10000) * 10000);
      if (S.cash < 0 && need > 0) { S.loan += need; S.cash += need; monthMsg.rescue.push(["Otomatik kredi açıldı", need]); }
    }
    if (S.cash < -overdraftLimit()) { S.over = true; addRecord("İflas"); save(); render(); return showModal("bankrupt"); }
  }
  let clubBonus = 0;
  if (clubOn()) { clubBonus = Math.max(2000, Math.round(Math.max(0, netWorth()) * 0.003)); S.cash += clubBonus; S.stats.club = (S.stats.club || 0) + clubBonus; }
  S.nwHist.push(Math.round(netWorth())); if (S.nwHist.length > 180) S.nwHist.shift();
  const parts = [`Gün ${S.day}`];
  if (clubBonus) parts.push(`kulüp payı ${tl(clubBonus)}`);
  if (made) parts.push(`${made} yeni teklif`);
  if (wi.n) parts.push(`dükkan ${wi.n} satış ${tl(wi.rev)}`);
  if (collected) parts.push(`tahsilat ${tl(collected)}`);
  if (arrived) parts.push(`${arrived} sevkiyat geldi`);
  if (expired) parts.push(`${expired} teklif düştü`);
  if (taken.length) parts.push(`rakip ${taken.length} iş kaptı`);
  info(parts.join(" · "));
  if (lost) toast(`Karşılıksız çek: −${tl(lost)}`, true);
  if (failed) toast(`${failed} sipariş gecikti ve iptal oldu`, true);
  checkLevel(); checkAch(); genDaily(); beep(lost ? "bad" : "day");
  if (lost) fxShake(); else if (wi.rev > 0) fxMoney("+" + tlShort(wi.rev));
  save(); render();
  if (monthMsg && SET.monthModal) showModal("month", monthMsg);
  if (S.cards.length) showModal("card");
}

    if (S.cash < e.price) return toast("Nakit yetersiz: " + tl(e.price), true); S.cash -= e.price; l[k]++; toast(`${e.name} kuruldu: ${locName(l)}.`); save(); render(); },

    if (amt <= 0) return toast(level() === 0 ? "Banka seni henüz tanımıyor. Esnaf unvanında kredi açılır." : "Kredi limitin dolu.", true);
    S.loan += amt; S.cash += amt; toast(`${tl(amt)} kredi çekildi. Aylık faiz %${nf1.format(loanRate() * 100)}.`); save(); render(); },

  recvAct: v => {

let AC = null;
function beep(kind) {
  if (SET.sound) try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const seq = { cash: [[1318, 0.06], [1760, 0.14]], win: [[523, 0.1], [659, 0.1], [784, 0.1], [1047, 0.28]], error: [[180, 0.18]], bad: [[392, 0.16], [262, 0.32]], day: [[660, 0.05]] }[kind] || [];
    let t = AC.currentTime;
    for (const [fq, d] of seq) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === "error" ? "sawtooth" : kind === "day" ? "sine" : "triangle"; o.frequency.value = fq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.1, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02); t += d * 0.9;
    }
  } catch (e) {}
  if (SET.vibe) try {
    const H = NATIVE && NATIVE.Haptics;
    if (H) Promise.resolve(kind === "error" || kind === "bad" ? H.notification({ type: "ERROR" }) : kind === "win" ? H.notification({ type: "SUCCESS" }) : H.impact({ style: kind === "cash" ? "MEDIUM" : "LIGHT" })).catch(() => {});
    else if (navigator.vibrate) navigator.vibrate(kind === "error" || kind === "bad" ? [40, 40, 40] : kind === "win" ? [20, 30, 60] : 12);
  } catch (e) {}
}
function toast(msg, bad) {
  if (bad) beep("error");
  const t = document.getElementById("toast"), d = document.createElement("div");
  d.textContent = msg; if (bad) d.className = "bad"; t.appendChild(d);
  while (t.children.length > 3) t.firstChild.remove();
  setTimeout(() => d.remove(), 3400);
}

async function restoreNative() {
  if (!NATIVE || !NATIVE.Preferences) return;
  for (const k of [KEY, KEY_REC, KEY_SET, KEY_LEG, KEY_ENT]) {
    try { const r = await NATIVE.Preferences.get({ key: k }); if (r && r.value != null && localStorage.getItem(k) == null) localStorage.setItem(k, r.value); } catch (e) {}
