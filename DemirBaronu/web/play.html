<style>
/* Layout: one-screen phone trading desk. Ledger HUD on top, scrolling tab content, big "end day" bar + tab bar at the bottom.
   Single deliberate dark look: mill-scale blue-grey steel with a hot-rolled orange for money actions. */
:root {
  color-scheme: dark;
  --bg: #101418; --panel: #182027; --panel2: #212b34; --line: #2e3a45;
  --fg: #e9eef2; --muted: #8e9ba7; --hot: #ff7b2c; --hot-ink: #1e0d00;
  --steel: #8fb6d8; --good: #4cd893; --bad: #ff5d52; --warn: #ffc94a;
  --display: "Chakra Petch", "Arial Black", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --num: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; overflow: hidden;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.gut { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
button:disabled { opacity: .42; cursor: default; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.muted { color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }

/* HUD */
#hud { padding-block: 10px 8px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #151b21, var(--bg)); }
.hrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#coName { font-family: var(--display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--steel);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#dayChip { font-family: var(--num); font-size: 15px; color: var(--muted); white-space: nowrap; }
#dayChip b { color: var(--fg); font-weight: 600; }
#cash { font-family: var(--num); font-weight: 700; font-size: 36px; line-height: 1.05; }
#cash.neg { color: var(--bad); }
.stats { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.stats b { font-family: var(--num); font-size: 15px; font-weight: 600; color: var(--fg); }
.title { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 12px; text-transform: uppercase;
  letter-spacing: .06em; padding: 3px 8px; border-radius: 4px; background: var(--panel2); color: var(--hot); white-space: nowrap; }
#ticker { margin-top: 8px; font-size: 12px; display: flex; gap: 8px; align-items: center; min-height: 20px; }
#ticker .tag { font-family: var(--num); font-weight: 700; background: var(--hot); color: var(--hot-ink); padding: 1px 6px; border-radius: 3px; flex: none; }
#ticker span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* Content */
#main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
h2 { font-family: var(--display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; margin: 0; color: var(--steel); text-wrap: balance; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.45; background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 12px; }
.hint b { color: var(--fg); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 3px; background: var(--panel2); color: var(--muted); white-space: nowrap; }
.chip.hot { background: rgba(255,123,44,.16); color: var(--hot); }
.chip.st { background: rgba(143,182,216,.14); color: var(--steel); }
.chip.g { background: rgba(76,216,147,.14); color: var(--good); }
.chip.b { background: rgba(255,93,82,.15); color: var(--bad); }
.chip.w { background: rgba(255,201,74,.14); color: var(--warn); }
.filter { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filter button { padding: 6px 12px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 600; white-space: nowrap; }
.filter button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* Product rows */
.prow { display: flex; flex-direction: column; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.phead { display: grid; grid-template-columns: minmax(0,1fr) 64px auto; gap: 4px 10px; align-items: center; text-align: left; width: 100%; }
.prow.open { border-color: var(--steel); }
.prow.locked { opacity: .5; }
.pname { font-weight: 600; font-size: 14px; }
.pspec { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pprice { text-align: right; }
.pprice .num { font-size: 18px; font-weight: 600; display: block; line-height: 1.1; }
.pprice small { font-family: var(--num); font-size: 13px; }
.pstock { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.pstock b { color: var(--fg); font-family: var(--num); font-size: 14px; font-weight: 600; }
svg.spark { width: 64px; height: 24px; display: block; }
.trade { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; display: flex; flex-direction: column; gap: 8px; }
.qty { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.qty button { min-width: 44px; padding: 7px 8px; border-radius: 6px; background: var(--panel2); font-family: var(--num); font-size: 15px; font-weight: 600; }
.qty button[aria-pressed="true"] { background: var(--steel); color: var(--bg); }
.qty .q { font-family: var(--num); font-size: 22px; font-weight: 700; margin-left: auto; }
.line2 { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.line2 b { font-family: var(--num); font-size: 15px; color: var(--fg); font-weight: 600; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1 1 0; min-width: 0; padding: 10px 10px; border-radius: 7px; font-weight: 600; font-size: 14px; background: var(--panel2); line-height: 1.2; }
.btn small { display: block; font-family: var(--num); font-size: 13px; font-weight: 600; opacity: .85; }
.btn.hot { background: var(--hot); color: var(--hot-ink); }
.btn.st { background: var(--steel); color: var(--bg); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); flex: 0 0 auto; }

/* Order cards */
.ohead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ocust { font-weight: 600; min-width: 0; }
.ocust small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.oamt { text-align: right; flex: none; }
.oamt span.num { display: block; font-size: 20px; font-weight: 700; line-height: 1.1; }
.oamt small { font-size: 13px; color: var(--muted); }
.oprod { font-size: 13px; }
.oprod b { font-family: var(--num); font-size: 16px; }

/* Bars */
.bar { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--steel); border-radius: 4px; }
.bar i.full { background: var(--warn); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { font-family: var(--num); font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
.ladder { display: flex; flex-direction: column; gap: 4px; }
.ladder div { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
.ladder div.me { color: var(--hot); font-weight: 600; }
.ladder div.done { color: var(--fg); }
.item { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.item > div:first-child { min-width: 0; }
.item .btn { flex: 0 0 auto; }

/* Bottom */
#bottom { border-top: 1px solid var(--line); background: var(--panel); padding-block: 8px max(8px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
#endDay { width: 100%; padding: 13px; border-radius: 8px; background: var(--hot); color: var(--hot-ink); font-family: var(--display);
  font-size: 17px; letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: center; align-items: center; gap: 10px; }
#endDay small { font-family: var(--num); font-size: 14px; font-weight: 600; letter-spacing: 0; text-transform: none; opacity: .8; }
#tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
#tabs button { padding: 7px 2px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); position: relative; }
#tabs button[aria-selected="true"] { color: var(--fg); background: var(--panel2); }
#tabs svg { width: 20px; height: 20px; display: block; margin: 0 auto 2px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.badge { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--hot); color: var(--hot-ink);
  font-family: var(--num); font-size: 12px; font-weight: 700; line-height: 17px; padding: 0 4px; }

/* Toast + modal */
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100% - 28px));
  display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 20; }
#toast div { background: var(--fg); color: var(--bg); padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; box-shadow: 0 6px 24px rgba(0,0,0,.4);
  animation: tin .22s ease-out; }
#toast div.bad { background: var(--bad); color: #fff; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
#modal { position: fixed; inset: 0; background: rgba(5,8,10,.72); display: flex; align-items: flex-end; justify-content: center; z-index: 30;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px;
  max-height: 88%; overflow-y: auto; }
#modal h3 { font-family: var(--display); font-size: 22px; margin: 0; color: var(--hot); text-wrap: balance; }
#modal p { margin: 0; line-height: 1.5; color: var(--fg); }
#modal ul { margin: 0; padding-left: 18px; line-height: 1.5; color: var(--muted); }
#modal input { width: 100%; padding: 11px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 16px; }
@media (prefers-reduced-motion: reduce) { #toast div { animation: none; } }
</style>

<div id="app">

    <nav id="tabs" role="tablist"></nav>
  </footer>
</div>
<div id="toast" aria-live="polite"></div>
<div id="modal" hidden></div>

<script>
"use strict";
// ---------- Content ----------
const CATS = { sac: { name: "Sac", vol: 0.016 }, profil: { name: "Profil", vol: 0.012 }, boru: { name: "Boru", vol: 0.011 } };
const PRODUCTS = [
  { id: "hrp", name: "Siyah Sac (HRP)", cat: "sac", spec: "S235JR · 3 mm · 1500×6000", base: 27500, lvl: 0 },
  { id: "dkp", name: "DKP Sac", cat: "sac", spec: "DC01 · 1 mm · 1000×2000", base: 31500, lvl: 0 },
  { id: "bakl", name: "Baklavalı Sac", cat: "sac", spec: "S235 · 4/5 mm · 1250×2500", base: 33000, lvl: 1 },
  { id: "gsac", name: "Galvaniz Sac", cat: "sac", spec: "DX51D Z100 · 0,8 mm", base: 37000, lvl: 2 },
  { id: "pas", name: "Paslanmaz Sac", cat: "sac", spec: "AISI 304 · 2 mm · 2B", base: 128000, lvl: 4 },
  { id: "kutu", name: "Kutu Profil", cat: "profil", spec: "40×40×2 mm · 6 m", base: 30000, lvl: 0 },
  { id: "kose", name: "Köşebent", cat: "profil", spec: "50×50×5 mm · 6 m", base: 29000, lvl: 0 },
  { id: "npu", name: "NPU Profil", cat: "profil", spec: "NPU 100 · S235JR · 12 m", base: 31500, lvl: 1 },
  { id: "hea", name: "HEA Profil", cat: "profil", spec: "HEA 200 · S275JR · 12 m", base: 35000, lvl: 3 },
  { id: "sboru", name: "Sanayi Borusu", cat: "boru", spec: "Ø48,3×3 mm · 6 m", base: 30500, lvl: 0 },
  { id: "dgboru", name: "Doğalgaz Borusu", cat: "boru", spec: "EN 10255 · DN25 · 6 m", base: 36500, lvl: 2 },
  { id: "gboru", name: "Galvaniz Boru", cat: "boru", spec: "Ø33,7×3,2 mm · 6 m", base: 40500, lvl: 3 },
];
const P = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
const LEVELS = [
  { name: "Komisyoncu", tons: 0, worth: 0, qty: [0.5, 2.5], loan: 0, max: 3, perk: "Aracılıkla başla" },
  { name: "Esnaf", tons: 25, worth: 20000, qty: [1, 6], loan: 50000, max: 4, perk: "Vadeli satış, banka kredisi, baklavalı sac, NPU" },
  { name: "Toptancı", tons: 150, worth: 250000, qty: [3, 18], loan: 250000, max: 6, perk: "Galvaniz sac, doğalgaz borusu" },
  { name: "Bayi", tons: 800, worth: 1500000, qty: [6, 40], loan: 1000000, max: 8, perk: "HEA profil, galvaniz boru" },
  { name: "Distribütör", tons: 3000, worth: 8000000, qty: [12, 80], loan: 4000000, max: 10, perk: "Paslanmaz sac" },
  { name: "Demir Baronu", tons: 12000, worth: 40000000, qty: [20, 150], loan: 15000000, max: 12, perk: "Zirve" },
];
const WAREHOUSES = [
  { name: "Depo yok", cap: 0, price: 0, rent: 0 },
  { name: "Kiralık depo köşesi", cap: 12, price: 15000, rent: 2500 },
  { name: "Küçük depo", cap: 40, price: 90000, rent: 8000 },
  { name: "Depo + açık saha", cap: 120, price: 350000, rent: 20000 },
  { name: "Lojistik depo", cap: 400, price: 1400000, rent: 55000 },
  { name: "Liman deposu", cap: 1500, price: 6000000, rent: 160000 },
];
const VEHICLES = {
  van: { name: "Kamyonet", cap: 3, price: 180000, monthly: 9000 },
  truck: { name: "Kamyon", cap: 12, price: 650000, monthly: 26000 },
  tir: { name: "TIR", cap: 25, price: 1600000, monthly: 52000 },
};
const MACHINES = {
  shear: { name: "Giyotin makas", cats: ["sac"], price: 120000, desc: "Sac kesimini kendin yaparsın" },
  saw: { name: "Şerit testere", cats: ["boru", "profil"], price: 80000, desc: "Boru ve profil kesimini kendin yaparsın" },
};
const STAFF = {
  sales: { name: "Satış elemanı", salary: 35000, max: 8, desc: "+1 teklif/gün, daha iyi fiyat" },
  acc: { name: "Muhasebeci", salary: 40000, max: 1, desc: "Karşılıksız çek riski yarıya, faktoring yarı fiyatına" },
};
const EVENTS = [
  { cat: "all", drift: 0.006, days: 5, text: "Dolar/TL yükseldi: ithal hammadde pahalanıyor" },
  { cat: "sac", drift: -0.008, days: 6, text: "Çin'den ucuz sac ithalatı arttı" },
  { cat: "profil", drift: 0.007, days: 8, text: "İnşaat sezonu açıldı, profil talebi canlı" },
  { cat: "profil", drift: 0.01, days: 4, text: "Büyük haddehanede bakım duruşu: profil arzı daraldı" },
  { cat: "boru", drift: 0.008, days: 6, text: "Doğalgaz altyapı ihalesi açıklandı" },
  { cat: "all", drift: -0.005, days: 5, text: "AB sınırda karbon vergisi: ihraç malı iç piyasaya döndü" },
  { cat: "all", drift: -0.006, days: 6, text: "Hurda fiyatları geriledi" },
  { cat: "profil", drift: 0.006, days: 7, text: "Kentsel dönüşüm teşviki genişledi", also: { boru: 0.004 } },
  { cat: "sac", drift: -0.005, days: 6, text: "Otomotiv üretiminde yavaşlama" },
  { cat: "all", drift: 0.004, days: 6, text: "Faiz indirimi beklentisi piyasayı ısıttı" },
  { cat: "boru", drift: -0.006, days: 5, text: "Boru fabrikaları stok eritmek için iskonto yaptı" },
  { cat: "sac", drift: 0.008, days: 5, text: "Bobin ithalatına ek gümrük vergisi geldi" },
];
const FIRMS = ["Yıldız İnşaat", "Kaya Demir Doğrama", "Öztürk Makina", "Ege Konstrüksiyon", "Anadolu Sera", "Marmara Çelik Yapı", "Usta Ferhat Kaynak",
  "Çınar Tarım Makinaları", "Bereket Prefabrik", "Doğan Asansör", "Aksoy Römork", "Tuna Ferforje", "Karadeniz Tekne", "Güneş Solar Montaj",
  "Erdem Çatı Sistemleri", "Akın Raf Sistemleri", "Polat Kazan", "Şahin Mobilya Metal", "Kuzey Hangar", "Demirtaş Yapı Market", "Ova Sulama",
  "Başak Silo", "Kılıç Kepenk", "Arslan Merdiven"];
const CITIES = ["İstanbul", "Ankara", "İzmir", "Bursa", "Kocaeli", "Konya", "Kayseri", "Gaziantep", "Adana", "Eskişehir", "Manisa", "Sakarya"];
const RISK = { A: 0, B: 0.04, C: 0.12 };
const HIRED_PER_TON = 600, BROKER_SHIP = 500, BROKER_MARKUP = 0.035, OUTSOURCE_CUT = 0.05, CUT_PREMIUM = 0.07, SELLBACK = 0.965;
const brokerQuota = () => 3, BROKER_MAX_T = 8; // factories give a middleman at most 3 shipments/day, each ≤ 8 t
const LOAN_RATE = 0.035, OVERDRAFT_RATE = 0.05;

// ---------- Helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const nf0 = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
function tl(x) { const a = Math.abs(x); if (a >= 1e9) return nf2.format(x / 1e9) + " Mr ₺"; if (a >= 1e7) return nf2.format(x / 1e6) + " Mn ₺"; return nf0.format(Math.round(x)) + " ₺"; }
const ton = x => nf1.format(x) + " t";
const pct = x => (x >= 0 ? "+" : "") + nf1.format(x * 100) + "%";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r10 = x => Math.round(x / 10) * 10;

// ---------- State ----------
let S, UI = { tab: "orders", cat: "all", open: null, qty: 1 };
function newGame(name) {
  S = { v: 1, name: name || "Demir Ticaret", day: 1, cash: 5000, rep: 50, tons: 0, g: 0, market: {}, events: [], news: [],
    stock: {}, wh: 0, vehicles: { van: 0, truck: 0, tir: 0 }, machines: { shear: false, saw: false }, staff: { sales: 0, acc: 0 },
    loan: 0, recv: [], offers: [], active: [], usedCap: 0, nextId: 1, lastLevel: 0,
    stats: { profit: 0, deals: 0, brokered: 0, defaults: 0, best: 0, late: 0 }, seen: { intro: false, baron: false }, over: false };
  for (const p of PRODUCTS) S.market[p.id] = { d: gauss() * 0.03, hist: [] };
  for (let i = 0; i < 45; i++) stepMarket(true);
  S.news.unshift({ day: 1, text: "Piyasa sakin. İlk siparişini aracılıkla kapat." });
  genOffers(); genOffers();
}
const price = id => r10(P[id].base * Math.exp(S.market[id].d + S.g));
const prevPrice = id => { const h = S.market[id].hist; return h.length > 1 ? h[h.length - 2] : price(id); };
// Titles need both tonnage sold and net worth. A title once earned is kept.
const qualifies = i => S.tons >= LEVELS[i].tons && netWorthRaw() >= LEVELS[i].worth;
const level = () => S.lastLevel || 0;
const unlocked = () => PRODUCTS.filter(p => p.lvl <= level());
const whCap = () => WAREHOUSES[S.wh].cap;
const stockQty = id => (S.stock[id] ? S.stock[id].q : 0);
const stockTotal = () => Object.values(S.stock).reduce((a, s) => a + s.q, 0);
const stockValue = () => Object.entries(S.stock).reduce((a, [id, s]) => a + s.q * price(id), 0);
const recvTotal = () => S.recv.reduce((a, r) => a + r.amount, 0);
const netWorthRaw = () => S.cash + stockValue() + recvTotal() - S.loan;
const netWorth = netWorthRaw;
const fleetCap = () => Object.entries(S.vehicles).reduce((a, [k, n]) => a + n * VEHICLES[k].cap, 0);
const freeCap = () => Math.max(0, fleetCap() - S.usedCap);
const loanLimit = () => Math.round((LEVELS[level()].loan + Math.max(0, netWorth()) * 0.3) / 1000) * 1000;
const overdraftLimit = () => loanLimit() * 0.25 + 10000;
const hasMachine = cat => Object.entries(MACHINES).some(([k, m]) => S.machines[k] && m.cats.includes(cat));
const monthlyCosts = () => {
  const items = [
    ["Depo kirası", WAREHOUSES[S.wh].rent],
    ["Araç giderleri", Object.entries(S.vehicles).reduce((a, [k, n]) => a + n * VEHICLES[k].monthly, 0)],
    ["Maaşlar", S.staff.sales * STAFF.sales.salary + S.staff.acc * STAFF.acc.salary],
    ["Kredi faizi", S.loan * LOAN_RATE],
  ];
  return items;
};

// ---------- Market ----------
// Events on "all" move the global index; category events move that category's products.
function catDrift(cat) {
  let d = 0;
  for (const e of S.events) {
    if (cat === "__global" ? e.cat === "all" : e.cat === cat) d += e.drift;
    if (e.also && e.also[cat]) d += e.also[cat];
  }
  return d;
}
function stepMarket(silent) {
  S.g = S.g * 0.985 + catDrift("__global") + gauss() * 0.004;
  for (const p of PRODUCTS) {
    const m = S.market[p.id];
    m.d = m.d * 0.96 + catDrift(p.cat) + gauss() * CATS[p.cat].vol;
    m.d = Math.max(-0.35, Math.min(0.35, m.d));
    m.hist.push(price(p.id));
    if (m.hist.length > 60) m.hist.shift();
  }
  S.events.forEach(e => e.days--);
  S.events = S.events.filter(e => e.days > 0);
  if (Math.random() < 0.18) {
    const pool = EVENTS.filter(e => !S.events.some(x => x.text === e.text));
    const e = pick(pool);
    S.events.push({ ...e });
    if (!silent) S.news.unshift({ day: S.day, text: e.text, big: true });
  }
}

// ---------- Orders ----------
function genOffer() {
  const L = LEVELS[level()], lv = level();
  const prods = unlocked();
  const weights = prods.map(p => 1 + (catDrift(p.cat) > 0 ? 1.5 : 0));
  let r = Math.random() * weights.reduce((a, b) => a + b, 0), prod = prods[0];
  for (let i = 0; i < prods.length; i++) { r -= weights[i]; if (r <= 0) { prod = prods[i]; break; } }
  let qty = Math.max(0.5, Math.round(rnd(L.qty[0], L.qty[1]) * (1 + 0.08 * S.staff.sales) * 2) / 2);
  if (prod.id === "pas") qty = Math.max(0.5, Math.round(qty / 4 * 2) / 2);
  const pay = lv === 0 ? 0 : pick([0, 0, 0, 0, 0, 30, 30, 30, 60, 60]);
  const risk = lv === 0 ? pick(["A", "A", "B"]) : pick(["A", "A", "A", "A", "B", "B", "B", "C", "C"]);
  const cut = Math.random() < 0.22;
  const margin = rnd(0.04, 0.115) + (S.rep - 50) / 1200 + 0.004 * S.staff.sales;
  const prem = (pay === 30 ? 0.03 : pay === 60 ? 0.06 : 0) + (cut ? CUT_PREMIUM : 0) + (risk === "C" ? 0.02 : 0);
  return { id: S.nextId++, cust: pick(FIRMS), city: pick(CITIES), prod: prod.id, qty, pay, risk, cut,
    price: r10(price(prod.id) * (1 + margin + prem)), deadline: S.day + rint(2, 6), expires: S.day + 2 };
}
function genOffers() {
  const L = LEVELS[level()];
  const max = L.max + S.staff.sales;
  let n = 1 + Math.floor(Math.random() * (1.6 + level() * 0.8 + S.staff.sales * 0.7 + S.rep / 60));
  let made = 0;
  while (n-- > 0 && S.offers.length < max) { S.offers.push(genOffer()); made++; }
  return made;
}
const orderValue = o => o.qty * o.price;
function brokerCost(o) {
  const m = price(o.prod);
  return o.qty * (m * (1 + BROKER_MARKUP) + BROKER_SHIP + (o.cut ? m * 0.06 : 0));
}
function stockCosts(o) {
  const own = Math.min(o.qty, freeCap()), hired = o.qty - own;
  const cutCost = o.cut && !hasMachine(P[o.prod].cat) ? o.qty * price(o.prod) * OUTSOURCE_CUT : 0;
  return { own, hired, ship: hired * HIRED_PER_TON, cutCost, total: hired * HIRED_PER_TON + cutCost };
}
function stockProfit(o) {
  const s = S.stock[o.prod]; const cost = s && s.q >= o.qty ? s.cost : price(o.prod);
  return orderValue(o) - o.qty * cost - stockCosts(o).total;
}
function finishDeal(o, profit, how) {
  S.tons += o.qty; S.stats.deals++; S.stats.profit += profit; S.stats.best = Math.max(S.stats.best, profit);
  if (how === "broker") S.stats.brokered++;
  S.rep = Math.min(100, S.rep + (o.qty >= 20 ? 2 : 1));
  checkLevel();
}
function addRecv(o, amount) {
  S.recv.push({ id: o.id, cust: o.cust, amount, due: S.day + o.pay, risk: o.risk });
}
function deliverStock(o) {
  if (stockQty(o.prod) < o.qty) return toast("Depoda yeterli " + P[o.prod].name + " yok.", true);
  const c = stockCosts(o), s = S.stock[o.prod];
  if (S.cash < c.total && o.pay > 0) return toast("Nakliye ve kesim için " + tl(c.total) + " nakit gerekiyor.", true);
  const profit = orderValue(o) - o.qty * s.cost - c.total;
  s.q = Math.round((s.q - o.qty) * 100) / 100; if (s.q <= 0) delete S.stock[o.prod];
  S.usedCap += c.own;
  if (o.pay === 0) S.cash += orderValue(o) - c.total; else { S.cash -= c.total; addRecv(o, orderValue(o)); }
  removeOrder(o.id);
  finishDeal(o, profit, "stock");
  toast(`${o.cust}: ${ton(o.qty)} teslim edildi. Kâr ${tl(profit)}${o.pay ? " (" + o.pay + " gün vadede tahsil)" : ""}.`);
  render();
}
function deliverBroker(o) {
  if (o.qty > BROKER_MAX_T) return toast(`Fabrika aracıya en fazla ${BROKER_MAX_T} t sevk eder. Bu siparişi stoktan teslim etmelisin.`, true);
  if ((S.brokerToday || 0) >= brokerQuota()) return toast(`Fabrika bugün en fazla ${brokerQuota()} aracılık sevkiyatı yapıyor. Stoktan teslim et ya da yarını bekle.`, true);
  const cost = brokerCost(o), profit = orderValue(o) - cost;
  if (o.pay > 0) {
    if (S.cash < cost) return toast("Vadeli aracılıkta fabrikaya peşin ödersin: " + tl(cost) + " gerekiyor.", true);
    S.cash -= cost; addRecv(o, orderValue(o));
  } else S.cash += profit;
  S.brokerToday = (S.brokerToday || 0) + 1;
  removeOrder(o.id);
  finishDeal(o, profit, "broker");
  toast(`Aracılık: ${o.cust} siparişi fabrikadan sevk edildi. ${profit >= 0 ? "Kâr" : "Zarar"} ${tl(profit)}.`, profit < 0);
  render();
}
function removeOrder(id) { S.offers = S.offers.filter(o => o.id !== id); S.active = S.active.filter(o => o.id !== id); }
function findOrder(id) { return S.offers.find(o => o.id === id) || S.active.find(o => o.id === id); }

// ---------- Level ----------
function checkLevel() {
  let l = S.lastLevel;
  while (l + 1 < LEVELS.length && qualifies(l + 1)) l++;
  if (l > S.lastLevel) {
    S.lastLevel = l;
    const L = LEVELS[l];
    S.news.unshift({ day: S.day, text: `Yeni unvan: ${L.name}. Açılanlar: ${L.perk}.`, big: true });
    if (l === LEVELS.length - 1 && !S.seen.baron) { S.seen.baron = true; showModal("baron"); }
    else showModal("level");
  }
}

// ---------- Day end ----------
function endDay() {
  if (S.over) return;
  let collected = 0, lost = 0, expired = 0, failed = 0;
  // receivables due
  S.recv = S.recv.filter(r => {
    if (r.due > S.day + 1) return true;
    const p = RISK[r.risk] * (S.staff.acc ? 0.5 : 1);
    if (Math.random() < p) { lost += r.amount; S.stats.defaults++; S.news.unshift({ day: S.day + 1, text: `${r.cust} çeki karşılıksız çıktı: ${tl(r.amount)} kayıp.`, bad: true }); }
    else { collected += r.amount; S.cash += r.amount; }
    return false;
  });
  S.day++;
  S.usedCap = 0; S.brokerToday = 0;
  // expire offers, fail late active orders
  S.offers = S.offers.filter(o => { if (o.expires <= S.day) { expired++; return false; } return true; });
  S.active = S.active.filter(o => {
    if (o.deadline < S.day) { failed++; S.stats.late++; S.rep = Math.max(0, S.rep - 6);
      S.news.unshift({ day: S.day, text: `${o.cust} siparişini zamanında teslim edemedin. İtibar −6.`, bad: true }); return false; }
    return true;
  });
  stepMarket(false);
  const made = genOffers();
  let monthMsg = null;
  if ((S.day - 1) % 30 === 0) {
    const items = monthlyCosts();
    if (S.cash < 0) items.push(["Eksi bakiye faizi", -S.cash * OVERDRAFT_RATE]);
    const total = items.reduce((a, [, v]) => a + v, 0);
    S.cash -= total;
    monthMsg = { items, total };
    if (S.cash < -overdraftLimit()) { S.over = true; save(); render(); return showModal("bankrupt"); }
  }
  const parts = [`Gün ${S.day}`];
  if (made) parts.push(`${made} yeni teklif`);
  if (collected) parts.push(`tahsilat ${tl(collected)}`);
  if (expired) parts.push(`${expired} teklif düştü`);
  toast(parts.join(" · "), false);
  if (lost) toast(`Karşılıksız çek: −${tl(lost)}`, true);
  if (failed) toast(`${failed} sipariş gecikti ve iptal oldu`, true);
  checkLevel();
  save(); render();
  if (monthMsg) showModal("month", monthMsg);
}

// ---------- Actions ----------
function buy(id, q) {
  const cost = buyCost(id, q);
  if (q <= 0) return;
  if (stockTotal() + q > whCap() + 1e-9) return toast(whCap() ? "Depon dolu. Depoyu büyüt ya da stok sat." : "Önce bir depo kirala (Depo sekmesi).", true);
  if (S.cash < cost) return toast("Nakit yetersiz. Bankadan kredi çekebilirsin.", true);
  const s = S.stock[id] || (S.stock[id] = { q: 0, cost: 0 });
  s.cost = (s.cost * s.q + cost) / (s.q + q); s.q = Math.round((s.q + q) * 100) / 100;
  S.cash -= cost;
  toast(`${ton(q)} ${P[id].name} alındı: ${tl(cost)}`);
  save(); render();
}
function discount(q) { return q >= 200 ? 0.03 : q >= 50 ? 0.02 : q >= 10 ? 0.01 : 0; }
function buyCost(id, q) { return q * price(id) * (1 - discount(q)); }
function sellBack(id, q) {
  const s = S.stock[id]; if (!s || q <= 0) return;
  q = Math.min(q, s.q);
  const rev = q * price(id) * SELLBACK, profit = rev - q * s.cost;
  s.q = Math.round((s.q - q) * 100) / 100; if (s.q <= 0) delete S.stock[id];
  S.cash += rev; S.stats.profit += profit;
  toast(`${ton(q)} piyasaya satıldı: ${tl(rev)} (${profit >= 0 ? "kâr" : "zarar"} ${tl(profit)})`, profit < 0);
  save(); render();
}
function maxBuy(id) {
  const byCash = Math.floor(Math.max(0, S.cash) / (price(id) * 0.97) * 2) / 2;
  const bySpace = Math.floor((whCap() - stockTotal()) * 2) / 2;
  let q = Math.max(0, Math.min(byCash, bySpace));
  while (q > 0 && buyCost(id, q) > S.cash) q -= 0.5;
  return q;
}
const ACT = {
  endDay,
  tab: v => { UI.tab = v; UI.open = null; render(); document.getElementById("main").scrollTop = 0; },
  cat: v => { UI.cat = v; render(); },
  open: v => { UI.open = UI.open === v ? null : v; UI.qty = 1; render(); },
  qty: v => { UI.qty = v === "max" ? maxBuy(UI.open) : +v; render(); },
  buy: v => buy(v, UI.qty),
  sell: v => sellBack(v, UI.qty === 0 ? stockQty(v) : Math.min(UI.qty, stockQty(v))),
  sellAll: v => sellBack(v, stockQty(v)),
  accept: v => { const o = S.offers.find(x => x.id === +v); if (!o) return; S.offers = S.offers.filter(x => x !== o); S.active.push(o); toast(`${o.cust} siparişi kabul edildi. Son teslim: Gün ${o.deadline}.`); save(); render(); },
  broker: v => { const o = findOrder(+v); if (o) { deliverBroker(o); save(); } },
  stock: v => { const o = findOrder(+v); if (o) { deliverStock(o); save(); } },
  cancel: v => { const o = S.active.find(x => x.id === +v); if (!o) return; removeOrder(o.id); S.rep = Math.max(0, S.rep - 4); toast("Sipariş iptal edildi. İtibar −4.", true); save(); render(); },
  wh: () => { const n = WAREHOUSES[S.wh + 1]; if (!n) return; if (S.cash < n.price) return toast("Nakit yetersiz: " + tl(n.price) + " gerekiyor.", true);
    S.cash -= n.price; S.wh++; toast(`${n.name} hazır: ${ton(n.cap)} kapasite. Aylık kira ${tl(n.rent)}.`); save(); render(); },
  veh: k => { const v = VEHICLES[k]; if (S.cash < v.price) return toast("Nakit yetersiz: " + tl(v.price), true); S.cash -= v.price; S.vehicles[k]++; toast(`${v.name} filoya katıldı (+${v.cap} t/gün).`); save(); render(); },
  vehSell: k => { if (!S.vehicles[k]) return; const v = VEHICLES[k]; S.vehicles[k]--; S.cash += v.price * 0.6; toast(`${v.name} ikinci ele satıldı: ${tl(v.price * 0.6)}`); save(); render(); },
  mach: k => { const m = MACHINES[k]; if (S.machines[k]) return; if (S.cash < m.price) return toast("Nakit yetersiz: " + tl(m.price), true); S.cash -= m.price; S.machines[k] = true; toast(`${m.name} kuruldu.`); save(); render(); },
  hire: k => { const s = STAFF[k]; if (S.staff[k] >= s.max) return; S.staff[k]++; toast(`${s.name} işe başladı. Maaş ay sonunda: ${tl(s.salary)}.`); save(); render(); },
  fire: k => { if (!S.staff[k]) return; S.staff[k]--; toast(`${STAFF[k].name} ile yollar ayrıldı.`); save(); render(); },
  loan: v => { const room = loanLimit() - S.loan; const amt = Math.min(+v, room); if (amt <= 0) return toast(level() === 0 ? "Banka seni henüz tanımıyor. Esnaf unvanında kredi açılır." : "Kredi limitin dolu.", true);
    S.loan += amt; S.cash += amt; toast(`${tl(amt)} kredi çekildi. Aylık faiz %${nf1.format(LOAN_RATE * 100)}.`); save(); render(); },
  repay: v => { const amt = Math.min(+v || S.loan, S.loan, Math.max(0, S.cash)); if (amt <= 0) return toast("Ödeyecek nakit yok.", true); S.loan -= amt; S.cash -= amt; toast(`${tl(amt)} kredi ödendi.`); save(); render(); },
  factor: v => { const r = S.recv.find(x => x.id === +v); if (!r) return; const got = r.amount * (1 - factorRate(r)); S.cash += got; S.recv = S.recv.filter(x => x !== r); toast(`Alacak bankaya kırdırıldı: ${tl(got)} kasaya girdi.`); save(); render(); },
  reset: () => showModal("reset"),
  resetYes: () => { closeModal(); try { localStorage.removeItem(KEY); } catch (e) {} newGame(S.name); UI.tab = "orders"; save(); render(); showModal("intro"); },
  close: () => closeModal(),
  start: () => { const i = document.getElementById("coInput"); const n = (i && i.value.trim()) || "Demir Ticaret"; S.name = n.slice(0, 28); S.seen.intro = true; closeModal(); save(); render(); },
  restart: () => { closeModal(); newGame(S.name); save(); render(); showModal("intro"); },
};
const factorRate = r => (S.staff.acc ? 0.015 : 0.03) * Math.max(1, Math.ceil((r.due - S.day) / 30));

// ---------- Render ----------
const ICONS = {
  market: '<svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 6-8 3 3"/><path d="M3 21h18"/></svg>',
  orders: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  stock: '<svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6v10H3z"/><path d="M7 20v-6h10v6M7 17h10"/></svg>',

function spark(hist) {
  const h = hist.slice(-30), mn = Math.min(...h), mx = Math.max(...h), span = mx - mn || 1;
  const pts = h.map((v, i) => `${(i / (h.length - 1) * 62 + 1).toFixed(1)},${(22 - (v - mn) / span * 20).toFixed(1)}`).join(" ");
  const up = h[h.length - 1] >= h[0];
  const last = pts.split(" ").pop().split(",");
  return `<svg class="spark" viewBox="0 0 64 24" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up ? "var(--good)" : "var(--bad)"}" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2" fill="${up ? "var(--good)" : "var(--bad)"}"/></svg>`;
}

  document.getElementById("hudStats").innerHTML =
    `<span>Net değer <b>${tl(netWorth())}</b></span><span>Stok <b>${nf1.format(stockTotal())}/${whCap()} t</b></span><span>İtibar <b class="${S.rep < 35 ? "bad" : ""}">${Math.round(S.rep)}</b></span>` +
    (S.loan ? `<span>Kredi <b>${tl(S.loan)}</b></span>` : "");

  const tabs = [["orders", "Siparişler", ICONS.orders, S.offers.length + S.active.length], ["market", "Piyasa", ICONS.market, 0], ["stock", "Depo", ICONS.stock, 0], ["company", "Şirket", ICONS.company, 0]];
  document.getElementById("tabs").innerHTML = tabs.map(([k, l, ic, b]) =>

}
function payChip(o) { return o.pay ? `<span class="chip w">${o.pay} gün vade</span>` : `<span class="chip g">Peşin</span>`; }
function riskChip(o) { return `<span class="chip ${o.risk === "A" ? "st" : o.risk === "B" ? "w" : "b"}">Risk ${o.risk}</span>`; }
function orderCard(o, active) {

  const bc = brokerCost(o), bp = orderValue(o) - bc;
  const have = stockQty(o.prod), canStock = have >= o.qty;
  const sp = stockProfit(o), sc = stockCosts(o);
  const brokerBig = o.qty > BROKER_MAX_T;
  const brokerDisabled = brokerBig || (o.pay > 0 && S.cash < bc) || (S.brokerToday || 0) >= brokerQuota();

  return `<div class="card">
    <div class="ohead"><div class="ocust">${esc(o.cust)}<small>${o.city}</small></div>

    <div class="oprod"><b>${ton(o.qty)}</b> ${p.name} <span class="muted">· ${p.spec}</span></div>

      <span class="chip ${left <= 1 ? "b" : ""}">Son teslim: ${left <= 0 ? "bugün" : left + " gün"}</span>
      ${active ? "" : `<span class="chip">Teklif ${o.expires - S.day <= 1 ? "yarın düşer" : (o.expires - S.day) + " gün geçerli"}</span>`}</div>
    <div class="btns">
      <button class="btn ${canStock ? "" : "st"}" data-act="broker" data-v="${o.id}" ${brokerDisabled ? "disabled" : ""}>Aracılık<small class="${bp < 0 && !brokerBig ? "bad" : ""}">${brokerBig ? "En fazla " + BROKER_MAX_T + " t" : (bp >= 0 ? "+" : "") + tl(bp) + (o.pay ? " · " + tl(bc) + " peşin" : "")}</small></button>
      ${canStock ? `<button class="btn hot" data-act="stock" data-v="${o.id}">Stoktan teslim<small>${sp >= 0 ? "+" : ""}${tl(sp)}${sc.hired ? " · nakliye " + tl(sc.ship) : ""}</small></button>`
        : active ? `<button class="btn" data-act="tab" data-v="market">Stok al<small>${ton(have)} / ${ton(o.qty)} var</small></button>`
        : `<button class="btn" data-act="accept" data-v="${o.id}">Kabul et<small>${left} gün içinde teslim</small></button>`}
      ${active ? `<button class="btn ghost" data-act="cancel" data-v="${o.id}" aria-label="Siparişi iptal et">İptal</button>` : ""}
    </div></div>`;
}
function renderOrders() {
  let h = "";
  if (S.day <= 3 && S.tons < 3) h += `<div class="hint"><b>Sıfırdan başlıyorsun.</b> Depon ve kamyonun yok. Bir teklifte <b>Aracılık</b>'a bas. Mal fabrikadan doğrudan müşteriye gider, sen farkı alırsın. 15.000 ₺ biriktirince <b>Depo</b> sekmesinden depo kirala, ucuzken stok al, stoktan satarak daha çok kazan.</div>`;
  if (S.active.length) {
    h += `<section class="sec"><div class="sechead"><h2>Aktif siparişler</h2><span class="muted">${S.active.length}</span></div>${S.active.map(o => orderCard(o, true)).join("")}</section>`;
  }
  h += `<section class="sec"><div class="sechead"><h2>Yeni teklifler</h2><span class="muted">Aracılık ${brokerQuota() - (S.brokerToday || 0)}/${brokerQuota()} · araç ${ton(freeCap())}</span></div>`;
  h += S.offers.length ? S.offers.map(o => orderCard(o, false)).join("") : `<div class="hint">Şu an açık teklif yok. Günü bitir, yarın yeni teklifler gelir. Satış elemanı tutarsan her gün daha çok teklif gelir.</div>`;
  h += `</section>`;
  return h;
}
function renderMarket() {
  const cats = [["all", "Tümü"], ...Object.entries(CATS).map(([k, c]) => [k, c.name])];
  let h = `<div class="filter">${cats.map(([k, n]) => `<button aria-pressed="${UI.cat === k}" data-act="cat" data-v="${k}">${n}</button>`).join("")}</div>`;
  if (S.events.length) h += `<div class="chips">${S.events.map(e => `<span class="chip ${e.drift > 0 ? "g" : "b"}">${e.cat === "all" ? "Tüm piyasa" : CATS[e.cat].name} ${e.drift > 0 ? "▲" : "▼"} ${e.days} gün</span>`).join("")}</div>`;
  for (const p of PRODUCTS.filter(p => UI.cat === "all" || p.cat === UI.cat)) {
    const lock = p.lvl > level(), m = price(p.id), ch = m / prevPrice(p.id) - 1, s = S.stock[p.id];
    const open = UI.open === p.id && !lock;
    h += `<div class="prow ${open ? "open" : ""} ${lock ? "locked" : ""}">
      <button class="phead" data-act="${lock ? "" : "open"}" data-v="${p.id}" aria-expanded="${open}" ${lock ? "disabled" : ""}>
        <div style="min-width:0"><div class="pname">${p.name}</div><div class="pspec">${lock ? LEVELS[p.lvl].name + " unvanında açılır" : p.spec}</div></div>
        ${spark(S.market[p.id].hist)}
        <div class="pprice"><span class="num">${nf0.format(m)}</span><small class="${ch >= 0 ? "good" : "bad"}">${pct(ch)}</small> <small class="muted">₺/t</small></div>
      </button>
      ${s ? `<div class="pstock">Stok <b>${ton(s.q)}</b> · ort. maliyet <b>${nf0.format(s.cost)}</b> · <span class="${m * SELLBACK >= s.cost ? "good" : "bad"}">${pct(m / s.cost - 1)}</span></div>` : ""}
      ${open ? tradePanel(p) : ""}
    </div>`;
  }
  return h;
}
function tradePanel(p) {
  const m = price(p.id), q = UI.qty, cost = buyCost(p.id, q), d = discount(q), have = stockQty(p.id);
  const hist = S.market[p.id].hist.slice(-30), lo = Math.min(...hist), hi = Math.max(...hist);
  const space = whCap() - stockTotal();
  return `<div class="trade">
    <div class="line2"><span>30 gün en düşük <b>${nf0.format(lo)}</b></span><span>en yüksek <b>${nf0.format(hi)}</b></span></div>
    <div class="qty">${[0.5, 1, 5, 10, 25, 50].map(v => `<button aria-pressed="${q === v}" data-act="qty" data-v="${v}">${nf1.format(v)}</button>`).join("")}
      <button data-act="qty" data-v="max">Maks</button><span class="q">${ton(q)}</span></div>
    <div class="line2"><span>Tutar${d ? ` (toplu alım −%${d * 100})` : ""}</span><b>${tl(cost)}</b></div>
    <div class="line2"><span>Depoda boş yer</span><b>${ton(Math.max(0, space))}</b></div>
    <div class="btns">
      <button class="btn hot" data-act="buy" data-v="${p.id}" ${q <= 0 ? "disabled" : ""}>Al<small>${tl(cost)}</small></button>
      <button class="btn" data-act="sell" data-v="${p.id}" ${have <= 0 ? "disabled" : ""}>Piyasaya sat<small>${nf0.format(m * SELLBACK)} ₺/t</small></button>
    </div>
    ${whCap() ? "" : `<div class="hint">Stok tutmak için önce <b>Depo</b> sekmesinden bir depo kirala.</div>`}
  </div>`;
}
function renderStock() {
  const cap = whCap(), used = stockTotal(), W = WAREHOUSES[S.wh], N = WAREHOUSES[S.wh + 1];
  let h = `<section class="sec"><h2>${W.name}</h2><div class="card">
    <div class="line2"><span>Doluluk</span><b>${nf1.format(used)} / ${cap} t</b></div>
    <div class="bar"><i class="${cap && used / cap > 0.9 ? "full" : ""}" style="width:${cap ? Math.min(100, used / cap * 100) : 0}%"></i></div>
    <div class="line2"><span>Stok piyasa değeri</span><b>${tl(stockValue())}</b></div>
    ${W.rent ? `<div class="line2"><span>Aylık kira</span><b>${tl(W.rent)}</b></div>` : ""}</div></section>`;
  if (N) h += `<section class="sec"><h2>${S.wh ? "Depoyu büyüt" : "İlk depon"}</h2><div class="card">
    <div class="item"><div><b>${N.name}</b><div class="muted">${N.cap} t kapasite · aylık kira ${tl(N.rent)}</div></div>
    <button class="btn hot" data-act="wh" ${S.cash < N.price ? "disabled" : ""}>${tl(N.price)}</button></div></div></section>`;
  const ent = Object.entries(S.stock);
  h += `<section class="sec"><h2>Stok</h2>`;
  if (!ent.length) h += `<div class="hint">${cap ? "Depo boş. <b>Piyasa</b> sekmesinden fiyatı düşük ürünleri al. Haber bandını izle: yükseliş haberi geldiyse hemen stokla." : "Depon yok. Şimdilik siparişleri aracılıkla kapat."}</div>`;
  for (const [id, s] of ent) {
    const m = price(id), pl = s.q * (m - s.cost);
    h += `<div class="card"><div class="item"><div><b>${P[id].name}</b><div class="muted num">${ton(s.q)} · ort. ${nf0.format(s.cost)} ₺/t · piyasa ${nf0.format(m)} ₺/t</div></div>
      <div class="oamt"><span class="num ${pl >= 0 ? "good" : "bad"}">${pl >= 0 ? "+" : ""}${tl(pl)}</span><small>gerçekleşmemiş</small></div></div>
      <div class="btns"><button class="btn" data-act="tab" data-v="market">Piyasada gör</button><button class="btn ghost" data-act="sellAll" data-v="${id}">Tümünü sat · ${tl(s.q * m * SELLBACK)}</button></div></div>`;
  }
  return h + `</section>`;
}
function renderCompany() {
  const l = level(), L = LEVELS[l], N = LEVELS[l + 1];
  let h = `<section class="sec"><h2>Unvan</h2><div class="card">
    <div class="line2"><span>Toplam satılan</span><b>${ton(S.tons)}</b></div>
    ${N ? `<div class="bar"><i style="width:${Math.min(100, (S.tons - L.tons) / (N.tons - L.tons) * 100)}%"></i></div>
    <div class="line2"><span>Net değer</span><b class="${netWorth() >= N.worth ? "good" : ""}">${tl(netWorth())} / ${tl(N.worth)}</b></div>
    <div class="muted">${N.name} için ${ton(N.tons)} satış ve ${tl(N.worth)} net değer gerekir. Açılacaklar: ${N.perk}.</div>` : `<div class="good">Demir Baronu oldun. Artık hedef net değeri büyütmek.</div>`}
    <div class="ladder">${LEVELS.map((x, i) => `<div class="${i === l ? "me" : i < l ? "done" : ""}"><span>${x.name}</span><span class="num">${nf0.format(x.tons)} t · ${tl(x.worth)}</span></div>`).join("")}</div></div></section>`;
  // fleet
  h += `<section class="sec"><div class="sechead"><h2>Filo</h2><span class="muted">${ton(fleetCap())}/gün · fazlası nakliyeci ${HIRED_PER_TON} ₺/t</span></div><div class="card">`;
  for (const [k, v] of Object.entries(VEHICLES)) h += `<div class="item"><div><b>${v.name}</b> <span class="muted">× ${S.vehicles[k]}</span><div class="muted">${v.cap} t/gün · aylık ${tl(v.monthly)}</div></div>
    <div class="btns">${S.vehicles[k] ? `<button class="btn ghost" data-act="vehSell" data-v="${k}">Sat</button>` : ""}<button class="btn st" data-act="veh" data-v="${k}" ${S.cash < v.price ? "disabled" : ""}>${tl(v.price)}</button></div></div>`;
  h += `</div></section>`;
  // machines
  h += `<section class="sec"><h2>Kesim makineleri</h2><div class="card">`;
  for (const [k, m] of Object.entries(MACHINES)) h += `<div class="item"><div><b>${m.name}</b><div class="muted">${m.desc}. Ölçüye kesim siparişinde %5 fason masrafı kalkar.</div></div>
    ${S.machines[k] ? `<span class="chip g">Kurulu</span>` : `<button class="btn st" data-act="mach" data-v="${k}" ${S.cash < m.price ? "disabled" : ""}>${tl(m.price)}</button>`}</div>`;
  h += `</div></section>`;
  // staff
  h += `<section class="sec"><h2>Personel</h2><div class="card">`;
  for (const [k, s] of Object.entries(STAFF)) h += `<div class="item"><div><b>${s.name}</b> <span class="muted">× ${S.staff[k]}</span><div class="muted">${s.desc} · aylık ${tl(s.salary)}</div></div>
    <div class="btns">${S.staff[k] ? `<button class="btn ghost" data-act="fire" data-v="${k}">Çıkar</button>` : ""}<button class="btn st" data-act="hire" data-v="${k}" ${S.staff[k] >= s.max ? "disabled" : ""}>İşe al</button></div></div>`;
  h += `</div></section>`;
  // bank
  const lim = loanLimit(), step = Math.max(50000, Math.round(lim / 5 / 10000) * 10000);
  h += `<section class="sec"><h2>Banka</h2><div class="card"><div class="kv">
    <span>Kredi borcu</span><span>${tl(S.loan)}</span><span>Kredi limiti</span><span>${tl(lim)}</span>
    <span>Aylık faiz</span><span>%${nf1.format(LOAN_RATE * 100)}</span><span>Eksi bakiye sınırı</span><span>−${tl(overdraftLimit())}</span></div>
    <div class="btns"><button class="btn st" data-act="loan" data-v="${step}" ${lim - S.loan <= 0 ? "disabled" : ""}>Kredi çek<small>+${tl(Math.min(step, Math.max(0, lim - S.loan)))}</small></button>
    <button class="btn" data-act="repay" data-v="0" ${S.loan <= 0 || S.cash <= 0 ? "disabled" : ""}>Öde<small>${tl(Math.min(S.loan, Math.max(0, S.cash)))}</small></button></div></div></section>`;
  // receivables
  h += `<section class="sec"><div class="sechead"><h2>Alacaklar</h2><span class="muted">${tl(recvTotal())}</span></div>`;
  h += S.recv.length ? S.recv.slice().sort((a, b) => a.due - b.due).map(r => `<div class="card"><div class="item"><div><b>${esc(r.cust)}</b><div class="muted">Vade: Gün ${r.due} (${r.due - S.day} gün) · Risk ${r.risk}</div></div>
      <div class="oamt"><span class="num">${tl(r.amount)}</span></div></div>
      <button class="btn" data-act="factor" data-v="${r.id}">Faktoring: hemen ${tl(r.amount * (1 - factorRate(r)))} al</button></div>`).join("")
    : `<div class="hint">Vadeli sattığında alacakların burada görünür. Nakit sıkışırsa faktoringle bankaya kırdırabilirsin.</div>`;
  h += `</section>`;
  // month costs + stats
  const mc = monthlyCosts(), mt = mc.reduce((a, [, v]) => a + v, 0);
  h += `<section class="sec"><h2>Ay sonu giderleri</h2><div class="card"><div class="kv">${mc.map(([k, v]) => `<span>${k}</span><span>${tl(v)}</span>`).join("")}<span><b>Toplam</b></span><span><b>${tl(mt)}</b></span></div></div></section>`;
  h += `<section class="sec"><h2>İstatistik</h2><div class="card"><div class="kv">
    <span>Toplam kâr</span><span>${tl(S.stats.profit)}</span><span>Kapanan sipariş</span><span>${S.stats.deals} (aracılık ${S.stats.brokered})</span>
    <span>En kârlı iş</span><span>${tl(S.stats.best)}</span><span>Karşılıksız çek</span><span>${S.stats.defaults}</span><span>Geciken sipariş</span><span>${S.stats.late}</span></div></div></section>`;
  h += `<section class="sec"><h2>Haberler</h2><div class="card">${S.news.slice(0, 8).map(n => `<div class="line2"><span class="${n.bad ? "bad" : n.big ? "" : "muted"}" style="color:${n.bad ? "" : "var(--fg)"}">${esc(n.text)}</span><b>G${n.day}</b></div>`).join("")}</div></section>`;
  h += `<button class="btn ghost" style="align-self:flex-start" data-act="reset">Yeni oyun başlat</button>`;
  return h;
}
function render() {
  renderHud();
  const m = document.getElementById("main"), top = m.scrollTop;
  m.innerHTML = UI.tab === "orders" ? renderOrders() : UI.tab === "market" ? renderMarket() : UI.tab === "stock" ? renderStock() : renderCompany();
  m.scrollTop = top;
  document.getElementById("endDay").disabled = S.over;
}

// ---------- Toast / modal ----------
function toast(msg, bad) {
  const t = document.getElementById("toast"), d = document.createElement("div");
  d.textContent = msg; if (bad) d.className = "bad"; t.appendChild(d);
  while (t.children.length > 3) t.firstChild.remove();
  setTimeout(() => d.remove(), 3200);
}
function showModal(kind, data) {
  const md = document.getElementById("modal"); let h = "";
  const L = LEVELS[level()];
  if (kind === "intro") h = `<h3>Demir Baronu</h3>
    <p>Cebinde 5.000 ₺ ve bir telefon var. Deponu, kamyonun ve kredin yok. Hedefin, boru, profil ve sac ticaretinde <b>Demir Baronu</b> olmak: 12.000 ton satış ve 40 milyon ₺ net değer.</p>
    <ul><li><b>Aracılık</b> ile sermayesiz başla: siparişi al, fabrika doğrudan sevk etsin, farkı kazan.</li>
    <li>Depo kirala, ucuzken stokla, stoktan satarak marjını büyüt.</li><li>Haber bandını izle. Fiyatlar haberle oynar.</li>
    <li>Vadeli satış daha kârlıdır ama çek karşılıksız çıkabilir. Ay sonu kira, maaş ve faiz kesilir.</li></ul>
    <label for="coInput" class="muted">Şirketinin adı</label><input id="coInput" maxlength="28" value="${esc(S.name)}" autocomplete="off">
    <button class="btn hot" data-act="start">Ticarete başla</button>`;
  else if (kind === "level") h = `<h3>Yeni unvan: ${L.name}</h3><p>Açılanlar: ${L.perk}.</p><p class="muted">Siparişler büyüyor (${nf1.format(L.qty[0])}–${nf1.format(L.qty[1])} t). Kredi tabanın ${tl(L.loan)}.</p><button class="btn hot" data-act="close">Devam</button>`;
  else if (kind === "baron") h = `<h3>Demir Baronu oldun</h3><p>${S.day}. günde 12.000 ton ve 40 milyon ₺ barajını geçtin. 5.000 ₺ ve bir telefonla başlayan ${esc(S.name)}, artık piyasanın en büyük oyuncusu.</p><p class="muted">Net değer: ${tl(netWorth())} · Toplam kâr: ${tl(S.stats.profit)}</p><button class="btn hot" data-act="close">Oynamaya devam et</button>`;
  else if (kind === "month") h = `<h3>Ay sonu kapanışı</h3><div class="kv">${data.items.map(([k, v]) => `<span>${k}</span><span>${tl(v)}</span>`).join("")}<span><b>Toplam gider</b></span><span><b>${tl(data.total)}</b></span><span>Kasa</span><span class="${S.cash < 0 ? "bad" : ""}">${tl(S.cash)}</span></div>
    ${S.cash < 0 ? `<p class="bad">Kasa eksiye düştü. Eksi bakiyeye aylık %5 faiz işler. −${tl(overdraftLimit())} altında iflas edersin.</p>` : ""}<button class="btn hot" data-act="close">Tamam</button>`;
  else if (kind === "bankrupt") h = `<h3>İflas</h3><p>Ay sonu giderleri ödenemedi. Kasa ${tl(S.cash)} ile eksi bakiye sınırını aştı.</p><p class="muted">${S.day} gün dayandın, ${ton(S.tons)} sattın, unvanın ${L.name}.</p><button class="btn hot" data-act="restart">Sıfırdan yeniden başla</button>`;
  else if (kind === "reset") h = `<h3>Yeni oyun?</h3><p>Bu şirketteki tüm ilerleme silinir.</p><div class="btns"><button class="btn" data-act="close">Vazgeç</button><button class="btn hot" data-act="resetYes">Sil ve başla</button></div>`;
  md.innerHTML = `<div class="box" role="dialog" aria-modal="true">${h}</div>`;
  md.hidden = false;
  const f = md.querySelector("input, .btn.hot"); if (f) f.focus();
}
function closeModal() { const md = document.getElementById("modal"); md.hidden = true; md.innerHTML = ""; }

// ---------- Save ----------
const KEY = "demir-baronu-v1";
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.v === 1) return s; } catch (e) {} return null; }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act; if (ACT[a]) ACT[a](b.dataset.v);
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "coInput") ACT.start(); });

function start(data) {
  S = (data && data.S) || load();
  if (data && data.UI) UI = data.UI;
  if (!S) newGame();
  render();
  if (!S.seen.intro) showModal("intro");
  else if (S.over) showModal("bankrupt");
}
window.claude?.hot?.snapshot?.(() => ({ S, UI }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
