html, body { height: 100%; }

button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
button:disabled { opacity: .42; cursor: default; }

.num { font-family: var(--num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.muted { color: var(--muted); }

#hud { padding-block: 10px 8px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #151b21, var(--bg)); }
.hrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#coName { font-family: var(--display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--steel);

#ticker { margin-top: 8px; font-size: 12px; display: flex; gap: 8px; align-items: center; min-height: 20px; }
#ticker .tag { font-family: var(--num); font-weight: 700; background: var(--hot); color: var(--hot-ink); padding: 1px 6px; border-radius: 3px; flex: none; }
#news { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* Content */
#main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
h2 { font-family: var(--display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; margin: 0; color: var(--steel); text-wrap: balance; }
.sec { display: flex; flex-direction: column; gap: 8px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.45; background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 12px; }
.hint b { color: var(--fg); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

.chip.b { background: rgba(255,93,82,.15); color: var(--bad); }

svg.spark { width: 64px; height: 24px; display: block; }

.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); flex: 0 0 auto; }
.btn.sm { padding: 6px 10px; font-size: 13px; flex: 0 0 auto; }

.ohead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ocust { font-weight: 600; min-width: 0; }
.ocust small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.oamt { text-align: right; flex: none; }
.oamt span.num { display: block; font-size: 20px; font-weight: 700; line-height: 1.1; }
.oamt small { font-size: 13px; color: var(--muted); }
.oprod { font-size: 13px; }
.oprod b { font-family: var(--num); font-size: 16px; }

/* Facilities */
.bar { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--steel); border-radius: 4px; }

.kv { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; font-size: 13px; }

function km(a, b) {
  if (a === b) return 0;

// Events on "all" move the global index; category events move that category's products.
function catDrift(cat) {
  let d = 0;
  for (const e of S.events) {
    if (cat === "__global" ? e.cat === "all" : e.cat === cat) d += e.drift;
    if (e.also && e.also[cat]) d += e.also[cat];
  }
  return d;
}
function stepMarket(silent) {
  S.g = S.g * 0.985 + catDrift("__global") + gauss() * 0.004;
  for (const p of PRODUCTS) {
    const m = S.market[p.id];
    m.d = Math.max(-0.35, Math.min(0.35, m.d * 0.96 + catDrift(p.cat) + gauss() * CATS[p.cat].vol));
    m.hist.push(price(p.id));
    if (m.hist.length > 60) m.hist.shift();
  }
  S.events.forEach(e => e.days--);
  S.events = S.events.filter(e => e.days > 0);
  if (Math.random() < 0.2) {
    const e = pick(EVENTS.filter(e => !S.events.some(x => x.text === e.text)));
    S.events.push({ ...e });
    if (!silent) S.news.unshift({ day: S.day, text: e.text, big: true });
  }
}

function genOffer() {
  const L = LEVELS[level()], lv = level();
  const prods = unlocked();
  const prod = wpick(prods, prods.map(p => p.pop * (catDrift(p.cat) > 0 ? 2 : 1)));
  const city = wpick(CITIES, CITIES.map(c => c.size * (c.id === S.home ? 3 : S.locs.some(l => l.city === c.id) ? 2 : 1)));
  let qty = Math.max(0.5, Math.round(rnd(L.qty[0], L.qty[1]) * (1 + 0.08 * S.staff.sales) * 2) / 2);
  if (prod.base > 100000) qty = Math.max(0.5, Math.round(qty / 4 * 2) / 2);
  const firm = pick(FIRMS), loyal = (S.rel[firm] || 0) >= 3;
  const pay = lv === 0 ? 0 : pick([0, 0, 0, 0, 0, 30, 30, 30, 60, 60]);
  let risk = lv === 0 ? pick(["A", "A", "B"]) : pick(["A", "A", "A", "A", "B", "B", "B", "C", "C"]);
  if (loyal && risk !== "A") risk = risk === "C" ? "B" : "A";
  const proc = Math.random() < 0.28 ? pick(PROC_BY_CAT[prod.cat]) : null;
  const margin = rnd(0.04, 0.115) + (S.rep - 50) / 1200 + 0.004 * S.staff.sales + (loyal ? 0.015 : 0);
  const prem = (pay === 30 ? 0.03 : pay === 60 ? 0.06 : 0) + (proc ? PROCS[proc].prem : 0) + (risk === "C" ? 0.02 : 0);
  return { id: S.nextId++, cust: firm, city: city.id, prod: prod.id, qty, pay, risk, proc, loyal,
    price: r10(price(prod.id) * (1 + margin + prem)), deadline: S.day + rint(2, 6), expires: S.day + 2 };
}
function genOffers() {
  const max = LEVELS[level()].max + S.staff.sales;
  let n = 1 + Math.floor(Math.random() * (1.6 + level() * 0.8 + S.staff.sales * 0.7 + S.rep / 60));
  let made = 0;
  while (n-- > 0 && S.offers.length < max) { S.offers.push(genOffer()); made++; }

}
const orderValue = o => o.qty * o.price;

}
function shipCost(from, to, q, capLeft) {
  const own = Math.min(q, capLeft), hired = q - own;
  return { own, hired, cost: own * shipRate(from, to, true) + hired * shipRate(from, to, false) };
}
function procCost(o) { return o.proc && !hasMachine(o.proc, P[o.prod].cat) ? o.qty * price(o.prod) * PROCS[o.proc].fason : 0; }
// Cheapest facility that has the goods and loading capacity today.
function bestSource(o) {
  let best = null;
  for (const l of S.locs) {
    if (sq(l, o.prod) < o.qty || handleLeft(l) < o.qty) continue;
    const sc = shipCost(l.city, o.city, o.qty, freeCap()), total = sc.cost + procCost(o);
    if (!best || total < best.total) best = { l, sc, total, proc: procCost(o) };
  }
  return best;
}
function sourceBlock(o) {

function addRecv(o, amount) { S.recv.push({ id: o.id, cust: o.cust, amount, due: S.day + o.pay, risk: o.risk }); }

  if (o.pay > 0 && S.cash < src.total) return toast("Nakliye ve işleme için " + tl(src.total) + " nakit gerekiyor.", true);

  const profit = orderValue(o) - o.qty * unit - src.total;

}
function deliverBroker(o) {
  if (o.qty > BROKER_MAX_T) return toast(`Fabrika aracıya en fazla ${BROKER_MAX_T} t sevk eder. Bu siparişi stoktan teslim etmelisin.`, true);
  if (S.brokerToday >= brokerQuota()) return toast(`Fabrika bugün en fazla ${brokerQuota()} aracılık sevkiyatı yapıyor.`, true);
  const cost = brokerCost(o), profit = orderValue(o) - cost;
  if (o.pay > 0) {
    if (S.cash < cost) return toast("Vadeli aracılıkta fabrikaya peşin ödersin: " + tl(cost) + " gerekiyor.", true);
    S.cash -= cost; addRecv(o, orderValue(o));
  } else S.cash += profit;
  S.brokerToday++;
  removeOrder(o.id);
  finishDeal(o, profit, "broker");
  toast(`Aracılık: ${o.cust} siparişi fabrikadan sevk edildi. ${profit >= 0 ? "Kâr" : "Zarar"} ${tl(profit)}.`, profit < 0);
  save(); render();
}
function removeOrder(id) { S.offers = S.offers.filter(o => o.id !== id); S.active = S.active.filter(o => o.id !== id); }
function findOrder(id) { return S.offers.find(o => o.id === id) || S.active.find(o => o.id === id); }

// =====================================================================
// FACILITIES, BUYING, TRANSFERS
// =====================================================================
function openLoc(city, type) {
  if (S.locs.length >= maxLocs()) return toast(`${LEVELS[level()].name} unvanıyla en fazla ${maxLocs()} tesis açabilirsin.`, true);
  const t = LOC_TYPES[type].tiers[0];
  if (S.cash < t.price) return toast("Nakit yetersiz: " + tl(t.price) + " gerekiyor.", true);
  S.cash -= t.price;
  const l = { id: S.nextId++, city, type, tier: 0, stock: {}, fork: 0, crane: 0, clerks: 0, used: 0 };
  S.locs.push(l); UI.loc = l.id;
  toast(`${C[city].name} · ${C[city].osb}: ${t.name} açıldı. ${t.cap} t kapasite, aylık kira ${tl(t.rent)}.`);
  checkAch(); save(); render();
}
function upgradeLoc(id) {
  const l = locById(id), n = LOC_TYPES[l.type].tiers[l.tier + 1];
  if (!n) return;
  if (n.port && !C[l.city].port) return toast("Liman deposu yalnızca liman şehirlerinde kurulur.", true);
  if (S.cash < n.price) return toast("Nakit yetersiz: " + tl(n.price), true);
  S.cash -= n.price; l.tier++;
  toast(`${locName(l)} büyütüldü: ${n.name}, ${n.cap} t.`); save(); render();
}
const discount = q => q >= 200 ? 0.03 : q >= 50 ? 0.02 : q >= 10 ? 0.01 : 0;
const buyUnit = (id, q, mode) => price(id) * (1 - discount(q) - SUPPLY[mode].disc);
const buyCost = (id, q, mode = "spot") => q * buyUnit(id, q, mode);
function supplyBlock(mode, q, l) {
  const s = SUPPLY[mode];
  if (level() < s.lvl) return LEVELS[s.lvl].name + " unvanında açılır";
  if (q < s.min) return "En az " + s.min + " t";
  if (s.port && !C[l.city].port) return "Liman şehrinde tesis gerekir";
  return null;
}
function buy(id, q, mode = "spot", locId = UI.loc) {
  const l = locById(locId);
  if (!l) return toast("Önce bir depo ya da dükkan aç (Tesisler sekmesi).", true);
  if (q <= 0) return;
  const block = supplyBlock(mode, q, l); if (block) return toast(block, true);
  if (locFree(l) + 1e-9 < q) return toast(`${locName(l)} dolu. Boş yer: ${ton(locFree(l))}.`, true);
  const unit = buyUnit(id, q, mode), cost = q * unit;
  if (S.cash < cost) return toast("Nakit yetersiz. Bankadan kredi çekebilirsin.", true);
  S.cash -= cost;
  if (mode === "spot") { addStock(l, id, q, unit); toast(`${ton(q)} ${P[id].name} ${C[l.city].name} tesisine girdi: ${tl(cost)}`); }
  else { S.incoming.push({ pid: id, q, unit, loc: l.id, arrive: S.day + SUPPLY[mode].days, mode }); if (mode === "imp") S.stats.imports++;
    toast(`${SUPPLY[mode].name}: ${ton(q)} ${P[id].name} sipariş edildi, ${SUPPLY[mode].days} gün sonra gelir.`); }
  checkAch(); save(); render();
}
function sellBack(id, q, locId) {
  const l = locById(locId); if (!l || !l.stock[id] || q <= 0) return;
  q = Math.min(q, l.stock[id].q);
  const rev = q * price(id) * SELLBACK, unit = takeStock(l, id, q), profit = rev - q * unit;
  S.cash += rev; S.stats.profit += profit; S.mProfit += profit;
  toast(`${ton(q)} ${P[id].name} piyasaya satıldı: ${tl(rev)} (${profit >= 0 ? "kâr" : "zarar"} ${tl(profit)})`, profit < 0);
  save(); render();
}
function transfer(id, fromId, toId) {
  const a = locById(fromId), b = locById(toId); if (!a || !b || !a.stock[id]) return;
  const q = Math.floor(Math.min(a.stock[id].q, locFree(b), handleLeft(a)) * 2) / 2;
  if (q <= 0) return toast(handleLeft(a) <= 0 ? "Bu tesisin yükleme kapasitesi bugün doldu." : "Hedef tesiste yer yok.", true);
  const sc = shipCost(a.city, b.city, q, freeCap());
  if (S.cash < sc.cost) return toast("Nakliye için " + tl(sc.cost) + " gerekiyor.", true);
  S.cash -= sc.cost; S.usedCap += sc.own; a.used += q;
  const unit = takeStock(a, id, q);
  addStock(b, id, q, unit + sc.cost / q);
  UI.move = null;
  toast(`${ton(q)} ${P[id].name} ${C[b.city].name} tesisine taşındı. Nakliye ${tl(sc.cost)}.`);
  save(); render();
}
function maxBuy(id, mode) {
  const l = locById(UI.loc); if (!l) return 0;
  const byCash = Math.floor(Math.max(0, S.cash) / (price(id) * 0.9) * 2) / 2;
  let q = Math.max(0, Math.min(byCash, Math.floor(locFree(l) * 2) / 2));
  while (q > 0 && buyCost(id, q, mode) > S.cash) q -= 0.5;
  return q;
}

// =====================================================================
// LEVEL + ACHIEVEMENTS
// =====================================================================
const qualifies = i => S.tons >= LEVELS[i].tons && netWorth() >= LEVELS[i].worth;
function checkLevel() {
  let l = S.lastLevel;
  while (l + 1 < LEVELS.length && qualifies(l + 1)) l++;
  if (l > S.lastLevel) {
    S.lastLevel = l;
    S.news.unshift({ day: S.day, text: `Yeni unvan: ${LEVELS[l].name}. Açılanlar: ${LEVELS[l].perk}.`, big: true });
    if (l === LEVELS.length - 1 && !S.seen.baron) { S.seen.baron = true; showModal("baron"); } else showModal("level");
  }
}
const ACH = [
  ["first", "İlk iş", "İlk siparişi kapat", s => s.stats.deals >= 1, 1000],
  ["loc", "Kendi yerin", "İlk depo ya da dükkanı aç", s => s.locs.length >= 1, 3000],
  ["shop", "Tabela astın", "İlk dükkanı aç", s => s.locs.some(l => l.type === "shop"), 5000],
  ["retail", "Kapı müşterisi", "Dükkanda 25 perakende satış yap", s => s.stats.retail >= 25, 10000],
  ["van", "Direksiyon sende", "İlk aracı al", s => fleetCap() > 0, 10000],
  ["machine", "Atölye", "İlk kesim makinesini kur", s => Object.values(s.machines).some(Boolean), 10000],
  ["t100", "100 ton", "Toplam 100 t sat", s => s.tons >= 100, 15000],
  ["cities3", "Üç şehir", "3 farklı şehirde tesis aç", s => new Set(s.locs.map(l => l.city)).size >= 3, 50000],
  ["loyal10", "Güvenilir tüccar", "10 sadık müşteriye ulaş", s => Object.values(s.rel).filter(v => v >= 3).length >= 10, 50000],
  ["insured", "Sağlam adım", "Stoklarını sigortala", s => s.insured, 5000],
  ["t1000", "1.000 ton", "Toplam 1.000 t sat", s => s.tons >= 1000, 100000],
  ["m1", "Milyoner", "1 Mn ₺ net değer", s => netWorth() >= 1e6, 50000],
  ["import", "Gemi yanaştı", "İlk ithalatı yap", s => s.stats.imports >= 1, 150000],
  ["laser", "Hassas iş", "Fiber lazer kur", s => !!s.machines.laser, 200000],
  ["m10", "On milyon", "10 Mn ₺ net değer", s => netWorth() >= 1e7, 250000],
  ["t10000", "10.000 ton", "Toplam 10.000 t sat", s => s.tons >= 10000, 1000000],
  ["m100", "Yüz milyon", "100 Mn ₺ net değer", s => netWorth() >= 1e8, 2000000],
].map(([id, name, desc, test, reward]) => ({ id, name, desc, test, reward }));
function checkAch() {
  for (const a of ACH) if (!S.ach[a.id] && a.test(S)) {
    S.ach[a.id] = S.day; S.cash += a.reward; S.rep = Math.min(100, S.rep + 2);
    toast(`Başarım: ${a.name}. Ödül ${tl(a.reward)}, itibar +2.`);
  }
}

// =====================================================================
// DAY END
// =====================================================================
function walkIns() {
  let rev = 0, n = 0;
  for (const l of S.locs.filter(l => l.type === "shop")) {
    const t = tierOf(l), c = C[l.city];
    let k = Math.round(t.walk * c.size * (1 + 0.5 * l.clerks) * (S.rep / 60) * rnd(0.6, 1.4));
    while (k-- > 0) {
      const ids = Object.keys(l.stock); if (!ids.length || handleLeft(l) <= 0) break;
      const id = wpick(ids, ids.map(i => P[i].pop));
      const q = Math.min(l.stock[id].q, handleLeft(l), r2(rnd(0.02, 0.2) * (P[id].base > 100000 ? 0.3 : 1)));
      if (q <= 0) continue;
      const p = price(id) * rnd(1.08, 1.16), unit = takeStock(l, id, q);
      l.used += q; S.cash += q * p; rev += q * p; n++;
      const profit = q * (p - unit);
      S.stats.profit += profit; S.mProfit += profit; S.stats.retail++; S.stats.retailRev += q * p; S.tons += q;
    }
  }
  return { rev, n };
}
function incidents() {
  for (const l of S.locs) {
    const ids = Object.keys(l.stock); if (!ids.length) continue;
    let loss = 0, what = "";
    if (Math.random() < 0.006 * (S.staff.guard ? 0.33 : 1)) {
      const id = pick(ids), q = r2(l.stock[id].q * rnd(0.1, 0.3)); loss = q * l.stock[id].cost; takeStock(l, id, q);
      what = `${locName(l)} tesisine hırsız girdi: ${ton(q)} ${P[id].name} çalındı`;
    } else if (Math.random() < 0.0015) {
      for (const id of ids) { const q = r2(l.stock[id].q * 0.4); if (q > 0) { loss += q * l.stock[id].cost; takeStock(l, id, q); } }
      what = `${locName(l)} tesisinde yangın: stoğun %40'ı zarar gördü`;
    }
    if (!loss) continue;
    S.stats.incidents++;
    if (S.insured) { S.cash += loss * 0.9; S.news.unshift({ day: S.day, text: `${what}. Sigorta ${tl(loss * 0.9)} ödedi.`, bad: true }); S.mProfit -= loss * 0.1; }
    else { S.news.unshift({ day: S.day, text: `${what}. Sigorta yok: ${tl(loss)} kayıp.`, bad: true }); S.mProfit -= loss; S.stats.profit -= loss; }
  }
}
function endDay() {
  if (S.over) return;
  const wi = walkIns();
  let collected = 0, lost = 0, expired = 0, failed = 0, arrived = 0;
  S.recv = S.recv.filter(r => {
    if (r.due > S.day + 1) return true;
    if (Math.random() < RISK[r.risk] * (S.staff.acc ? 0.5 : 1)) { lost += r.amount; S.stats.defaults++; S.mProfit -= r.amount; S.stats.profit -= r.amount;
      S.news.unshift({ day: S.day + 1, text: `${r.cust} çeki karşılıksız çıktı: ${tl(r.amount)} kayıp.`, bad: true }); }
    else { collected += r.amount; S.cash += r.amount; }
    return false;
  });
  S.day++;
  S.usedCap = 0; S.brokerToday = 0; S.locs.forEach(l => l.used = 0);
  S.incoming = S.incoming.filter(i => {
    if (i.arrive > S.day) return true;
    const l = locById(i.loc); if (l) { addStock(l, i.pid, i.q, i.unit); arrived++; S.news.unshift({ day: S.day, text: `${ton(i.q)} ${P[i.pid].name} ${C[l.city].name} tesisine teslim edildi.` }); }
    return false;
  });
  incidents();
  S.offers = S.offers.filter(o => { if (o.expires <= S.day) { expired++; return false; } return true; });
  S.active = S.active.filter(o => {
    if (o.deadline >= S.day) return true;
    failed++; S.stats.late++; S.rep = Math.max(0, S.rep - 6);
    S.news.unshift({ day: S.day, text: `${o.cust} siparişini zamanında teslim edemedin. İtibar −6.`, bad: true });
    return false;
  });
  stepMarket(false);
  const made = genOffers();
  let monthMsg = null;
  if ((S.day - 1) % 30 === 0) {
    const items = monthlyCosts();
    if (S.cash < 0) items.push(["Eksi bakiye faizi", -S.cash * OVERDRAFT_RATE]);
    const costs = items.reduce((a, [, v]) => a + v, 0);
    const taxable = S.mProfit - costs, tax = Math.max(0, taxable) * TAX_RATE;
    if (tax > 0) items.push([`Geçici vergi (%${TAX_RATE * 100})`, tax]);
    S.stats.taxes += tax;
    const total = costs + tax;
    S.cash -= total;
    monthMsg = { items, total, net: taxable - tax };
    S.mProfit = 0;
    if (S.cash < -overdraftLimit()) { S.over = true; save(); render(); return showModal("bankrupt"); }
  }
  S.nwHist.push(Math.round(netWorth())); if (S.nwHist.length > 180) S.nwHist.shift();
  const parts = [`Gün ${S.day}`];
  if (made) parts.push(`${made} yeni teklif`);
  if (wi.n) parts.push(`dükkan ${wi.n} satış ${tl(wi.rev)}`);
  if (collected) parts.push(`tahsilat ${tl(collected)}`);
  if (arrived) parts.push(`${arrived} sevkiyat geldi`);
  if (expired) parts.push(`${expired} teklif düştü`);
  toast(parts.join(" · "));
  if (lost) toast(`Karşılıksız çek: −${tl(lost)}`, true);
  if (failed) toast(`${failed} sipariş gecikti ve iptal oldu`, true);
  checkLevel(); checkAch();
  save(); render();
  if (monthMsg) showModal("month", monthMsg);
}

  const up = h[h.length - 1] >= h[0], col = up ? "var(--good)" : "var(--bad)", last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 64 24" aria-hidden="true"><polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2" fill="${col}"/></svg>`;
}

  const lim = loanLimit(), step = Math.max(50000, Math.round(lim / 5 / 10000) * 10000);
  h += `<section class="sec"><h2>Banka</h2><div class="card"><div class="kv">
    <span>Kredi borcu</span><span>${tl(S.loan)}</span><span>Kredi limiti</span><span>${tl(lim)}</span>
    <span>Aylık faiz</span><span>%${nf1.format(LOAN_RATE * 100)}</span><span>Eksi bakiye sınırı</span><span>−${tl(overdraftLimit())}</span></div>
    <div class="btns"><button class="btn st" data-act="loan" data-v="${step}" ${lim - S.loan <= 0 ? "disabled" : ""}>Kredi çek<small>+${tl(Math.min(step, Math.max(0, lim - S.loan)))}</small></button>
    <button class="btn" data-act="repay" data-v="0" ${S.loan <= 0 || S.cash <= 0 ? "disabled" : ""}>Öde<small>${tl(Math.min(S.loan, Math.max(0, S.cash)))}</small></button></div></div></section>`;
  h += `<section class="sec"><div class="sechead"><h2>Alacaklar</h2><span class="muted">${tl(recvTotal())}</span></div>`;
  h += S.recv.length ? S.recv.slice().sort((a, b) => a.due - b.due).map(r => `<div class="card"><div class="item"><div><b>${esc(r.cust)}</b><div class="muted">Vade: Gün ${r.due} (${r.due - S.day} gün) · Risk ${r.risk}</div></div>
      <div class="oamt"><span class="num">${tl(r.amount)}</span></div></div>
      <button class="btn" data-act="factor" data-v="${r.id}">Faktoring: hemen ${tl(r.amount * (1 - factorRate(r)))} al</button></div>`).join("")
    : `<div class="hint">Vadeli sattığında alacakların burada görünür. Nakit sıkışırsa faktoringle bankaya kırdırabilirsin.</div>`;
  h += `</section>`;
  const mc = monthlyCosts(), mt = mc.reduce((a, [, v]) => a + v, 0);
  h += `<section class="sec"><h2>Ay sonu</h2><div class="card"><div class="kv">${mc.map(([k, v]) => `<span>${k}</span><span>${tl(v)}</span>`).join("")}
    <span><b>Sabit giderler</b></span><span><b>${tl(mt)}</b></span><span>Bu ayki kâr (şimdiye kadar)</span><span class="${S.mProfit >= 0 ? "good" : "bad"}">${tl(S.mProfit)}</span>
    <span>Tahmini vergi (%${TAX_RATE * 100})</span><span>${tl(Math.max(0, S.mProfit - mt) * TAX_RATE)}</span></div></div></section>`;
  const loyal = Object.entries(S.rel).filter(([, v]) => v >= 3).sort((a, b) => b[1] - a[1]);
  h += `<section class="sec"><div class="sechead"><h2>Sadık müşteriler</h2><span class="muted">${loyal.length}</span></div><div class="card">
    ${loyal.length ? loyal.slice(0, 8).map(([f, v]) => `<div class="line2"><span>${esc(f)}</span><b>${v} iş</b></div>`).join("") : `<div class="muted">Bir firmaya 3 kez teslimat yapınca sadık müşterin olur: daha iyi fiyat, daha düşük risk.</div>`}</div></section>`;
  h += `<section class="sec"><div class="sechead"><h2>Başarımlar</h2><span class="muted">${Object.keys(S.ach).length}/${ACH.length}</span></div><div class="card">
    ${ACH.map(a => `<div class="ach"><span class="${S.ach[a.id] ? "ok" : "no"}">${S.ach[a.id] ? "✓" : "○"}</span><div><b>${a.name}</b><div class="muted">${a.desc}</div></div><span class="num muted">${tl(a.reward)}</span></div>`).join("")}</div></section>`;
  h += `<section class="sec"><h2>İstatistik</h2><div class="card"><div class="kv">
    <span>Toplam kâr</span><span>${tl(S.stats.profit)}</span><span>Kapanan sipariş</span><span>${S.stats.deals} (aracılık ${S.stats.brokered})</span>
    <span>Perakende satış</span><span>${S.stats.retail} · ${tl(S.stats.retailRev)}</span><span>En kârlı iş</span><span>${tl(S.stats.best)}</span>
    <span>Ödenen vergi</span><span>${tl(S.stats.taxes)}</span><span>Karşılıksız çek</span><span>${S.stats.defaults}</span>
    <span>Hırsızlık / yangın</span><span>${S.stats.incidents}</span><span>Geciken sipariş</span><span>${S.stats.late}</span></div></div></section>`;
  h += `<section class="sec"><h2>Haberler</h2><div class="card">${S.news.slice(0, 10).map(n => `<div class="line2"><span class="${n.bad ? "bad" : ""}" style="${n.bad ? "" : "color:var(--fg)"}">${esc(n.text)}</span><b>G${n.day}</b></div>`).join("")}</div></section>`;
  h += `<button class="btn ghost" style="align-self:flex-start" data-act="reset">Yeni oyun başlat</button>`;
  return h;
}
function render() {
  renderHud();
  const m = document.getElementById("main"), top = m.scrollTop;
  m.innerHTML = UI.tab === "orders" ? renderOrders() : UI.tab === "market" ? renderMarket() : UI.tab === "stock" ? renderStock() : renderCompany();
  m.scrollTop = top;
  document.getElementById("endDay").disabled = S.over;
}

// =====================================================================
// TOAST / MODAL
// =====================================================================
function toast(msg, bad) {
  const t = document.getElementById("toast"), d = document.createElement("div");
  d.textContent = msg; if (bad) d.className = "bad"; t.appendChild(d);
  while (t.children.length > 3) t.firstChild.remove();
  setTimeout(() => d.remove(), 3400);
}
function showModal(kind, data) {
  const md = document.getElementById("modal"); let h = "";
  const L = LEVELS[level()];
  if (kind === "intro") h = `<h3>Demir Baronu</h3>
    <p>Cebinde 5.000 ₺ ve bir telefon var. Deponu, kamyonun ve kredin yok. Hedefin: <b>12.000 ton satış ve 40 milyon ₺ net değerle Demir Baronu olmak.</b></p>
    <ul><li><b>Aracılık</b> ile sermayesiz başla: siparişi al, fabrika doğrudan sevk etsin, farkı kazan.</li>
    <li>Depo kirala, ucuzken stokla. <b>Dükkan</b> aç, kapıdan perakende müşteri gelsin.</li>
    <li>48 ürün, 6 kategori, 15 şehir. Mesafe nakliye demektir; müşteriye yakın tesis aç.</li>
    <li>Haber bandını izle. Vadeli satış kârlı ama riskli. Ay sonunda kira, maaş, faiz ve vergi kesilir.</li></ul>
    <label for="coInput" class="muted">Şirketinin adı</label><input id="coInput" maxlength="28" value="${esc(S.name)}" autocomplete="off">
    <label for="homeCity" class="muted">Merkez şehrin (en çok sipariş buradan gelir)</label>
    <select id="homeCity">${CITIES.map(c => `<option value="${c.id}" ${c.id === S.home ? "selected" : ""}>${c.name} · ${c.osb}</option>`).join("")}</select>
    <button class="btn hot" data-act="start">Ticarete başla</button>`;
  else if (kind === "level") h = `<h3>Yeni unvan: ${L.name}</h3><p>Açılanlar: ${L.perk}.</p><p class="muted">Siparişler büyüyor (${nf1.format(L.qty[0])}–${nf1.format(L.qty[1])} t). Kredi tabanın ${tl(L.loan)}, en fazla ${L.locs} tesis.</p><button class="btn hot" data-act="close">Devam</button>`;
  else if (kind === "baron") h = `<h3>Demir Baronu oldun</h3><p>${S.day}. günde 12.000 ton ve 40 milyon ₺ barajını geçtin. 5.000 ₺ ve bir telefonla başlayan ${esc(S.name)}, artık piyasanın en büyük oyuncusu.</p><p class="muted">Net değer: ${tl(netWorth())} · Toplam kâr: ${tl(S.stats.profit)}</p><button class="btn hot" data-act="close">Oynamaya devam et</button>`;
  else if (kind === "month") h = `<h3>Ay sonu kapanışı</h3><div class="kv">${data.items.map(([k, v]) => `<span>${k}</span><span>${tl(v)}</span>`).join("")}<span><b>Toplam gider</b></span><span><b>${tl(data.total)}</b></span>
    <span>Ayın net kârı</span><span class="${data.net >= 0 ? "good" : "bad"}">${tl(data.net)}</span><span>Kasa</span><span class="${S.cash < 0 ? "bad" : ""}">${tl(S.cash)}</span></div>
    ${S.cash < 0 ? `<p class="bad">Kasa eksiye düştü. Eksi bakiyeye aylık %5 faiz işler. −${tl(overdraftLimit())} altında iflas edersin.</p>` : ""}<button class="btn hot" data-act="close">Tamam</button>`;
  else if (kind === "bankrupt") h = `<h3>İflas</h3><p>Ay sonu giderleri ödenemedi. Kasa ${tl(S.cash)} ile eksi bakiye sınırını aştı.</p><p class="muted">${S.day} gün dayandın, ${ton(S.tons)} sattın, unvanın ${L.name}.</p><button class="btn hot" data-act="restart">Sıfırdan yeniden başla</button>`;
  else if (kind === "reset") h = `<h3>Yeni oyun?</h3><p>Bu şirketteki tüm ilerleme silinir.</p><div class="btns"><button class="btn" data-act="close">Vazgeç</button><button class="btn hot" data-act="resetYes">Sil ve başla</button></div>`;
  md.innerHTML = `<div class="box" role="dialog" aria-modal="true">${h}</div>`;
  md.hidden = false;
  const f = md.querySelector("input, .btn.hot"); if (f) f.focus();
}
function closeModal() { const md = document.getElementById("modal"); md.hidden = true; md.innerHTML = ""; }

// =====================================================================
// SAVE + BOOT
// =====================================================================
const KEY = "demir-baronu-v2";
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.v === 2) return s; } catch (e) {} return null; }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act; if (ACT[a]) ACT[a](b.dataset.v);
});
document.addEventListener("change", e => { if (e.target.id === "newCity") { UI.newCity = e.target.value; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "coInput") ACT.start(); });

function start(data) {
  S = (data && data.S && data.S.v === 2 && data.S) || load();
  if (data && data.UI && S) UI = Object.assign(UI, data.UI);
  if (!S) newGame();
  render();
  if (!S.seen.intro) showModal("intro");
  else if (S.over) showModal("bankrupt");
}
window.claude?.hot?.snapshot?.(() => ({ S, UI }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
